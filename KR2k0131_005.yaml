body:
  text: 臺海使槎録卷五常鎮揚通道黃叔璥撰臺盡畨地也雕題劗髮蟻雜蜂屯海外于役實以綏輯為難恭聆聖訓以臺地士庶盡閩之漳泉粵之惠潮無長子孫以世居者諸畨乃土著之民其令有司撫恤之余始來此見其盱睢渾噩質勝而野逮厯其境止其舍目擊其飲食動息與中土人民無二長跪送迎悚然知惕既以傔從兵辨秋毫不犯則又歡然交欣瀕行耄孺攀依不忍舍此固天性未漓豈降才爾殊耶近者社中間有讀四子書習一經者鼓舞化導不可變狉榛而文物耶畨社不一俗尚各殊比而同之不可也余撮其大要凡六檄行南北兩令於各社風俗歌謡分類詳注為畨俗六考於以識我朝重熙纍洽光天之下至於海隅蒼生守土者凛遵謨訓殫心拊循勿謂異類而莫之恤修教齊政以昭中外同風之盛實有厚望焉北路諸羅畨一新港目加溜灣一名灣裏蕭壠麻豆卓猴居處作室名囤先以竹木結成椽桷編竹為墻蓋以茅草為兩大扇中豎大梁備酒豕邀請畨衆舉上兩扇合為屋狀如覆舟寬二丈餘長數丈前後門戶疏通夫妻子女同聚一室門兩旁上下丹雘采色燦然可觀舍內地淨無塵前廊竹木鋪設如橋俯欄頗亦有致鑿木板為階梯木極堅韌或以相思木為之又一種木文理樛結如檀梨狀從內山採出畨亦不名何木高可五六尺入室者拾級而入飲食飯凡二種一占米煮食一篾筒貯糯米置釜上蒸熟手團食日三飱出則裹腰間酒凡二種一舂秫米使碎嚼米為麵置地上隔夜發氣拌和藏甕中數日發變其味甘酸曰姑待婚娶築舍捕鹿出此酒沃以水羣坐地上用木瓢或椰碗汲飲之酒酣歌舞夜深乃散一將糯米蒸熟拌麯入篾籃置甕口津液下滴藏久色味香美遇貴客始出以待敬客必先嘗而後進凡捕魚於水清處見魚發發用三叉鏢射之或手網取之小魚熟食大則醃食不剖魚腹就魚口納鹽藏甕中俟年餘生食之捕鹿名曰出草或鏢或箭帶犬追尋獲鹿即剝割羣聚而飲臟腑醃藏甕中名曰膏蚌鮭餘肉交通事貿易納餉衣飾衣黑白不等俱短至臍名籠仔用布二幅縫其半於背左右及腋而止餘尺許垂肩及臂無袖披其襟衣長至足者名􅥶暑則圍二幅半烏布寒則披􅥶近亦有倣漢人衣褌者畨婦衣短至腰或織茜毛於領或緣以他色腰下圍幅布旁無襞積為桶裙膝以下用烏布十餘重堅束其腓至踝頭上珠飾名曰沙其落瑪瑙珠名曰卑那苓頸挂銀錢約指螺貝及紅毛錢瓔珞纍纍盤繞數匝名曰夏落臂釧東洋鐲銅起花鐲或穿瑪瑙為之手圈名曰龜老若遇種粟之期羣聚會飲挽手歌唱跳躑旋轉以為樂名曰遇描堵麻達走遞公文插雉尾於首手背繫薩豉宜以鐵為之狀如捲荷長三寸許展足鬬捷腳掌去地尺餘撲及其臀沙起風飛手鐲與薩豉宜相擊丁當逺聞瞬息數十里習紅毛字者曰教册用鵝毛管削尖注墨汁於筒湛而橫書自左而右登記符檄錢穀數目暇則將鵝管插於頭上或貯腰間婚嫁婚姻名曰牽手訂盟時男家父母遺以布麻達畨未娶者成婚父母送至女家不需媒妁至日執豕酌酒請通事土官親戚聚飲賀新婚名曰描罩佳哩夫婦反目即離異男離婦罰酒一甕畨銀三餅女離男或私通被獲均如前例其未嫁娶者不禁若配合已久造高架坐婦於上舁迎諸社中畨衆贈遺色布歸宴同社之衆則永無離異喪葬畨死曰馬歹不論貧富俱用棺埋厝內以平日衣服器皿之半殉之喪家衣俱著皂色以示不變父母兄弟之喪俱一年夫死一年後改適必自為擇定告前夫父母及所生父母而後嫁器用耕種如牛車犂耙與漢人同厝內器皿各殊汲水用匏飯具用椰碗螺殼捕鹿用鏢箭炊飯用鐵鐺亦用木扣陶土為之圎底縮口微有唇起以承甑以石三塊為竈置木扣於上以炊近亦築竈間置桌椅及五綵瓷器非以資用為美觀耳螺錢皆漢人磨礲而成圓約三寸中一孔以潔白者為上每圓值銀四五分如古貝式各社皆然附畨歌新港社别婦歌馬無艾幾唎我愛汝美貌唷無晃米哰不能忘加麻無知各交實實想念麻各巴圭里文蘭彌勞我今去捕鹿查美狡呵阿孛沈沈唷無晃米哰心中輾轉愈不能忘奚如直落圭哩其文蘭待捕得鹿查下力柔下麻勾回來便相贈蕭壠社種稻歌呵搭其礁同伴在此加朱馬池唎唭麻如及時播種包烏頭烏達要求降雨符加量其斗逸保佑好年冬知葉搭著礁斗逸到冬熟後投滿生唭迦僉藍都須備祭品被離離帶明音免單到田間謝田神麻豆社思春歌唉加安呂燕夜間難寐音那馬無力圭吱腰從前遇著美女子礁嗎圭礁勞音毛噃我昨夜夢見伊沒生交耶音毛夫今尋至伊門前孩如未生吱連心中歡喜難説灣裏社誡婦歌朱連麼吱匏裏乞娶汝衆人皆知加直老巴棉煙原為傳代加年呀嗄加犂蠻須要好名聲拙年巴恩勞勞呀切勿做出壞事車加犂末礁嘮描彼此便覺好看附載土畨初以鹿皮為衣夏月結麻枲縷縷挂於下體後乃漸易幅布或以達戈紋畨自織布名為之數年來新港蕭壠麻豆目加溜灣諸畨衣褌半如漢人冬裝棉哆囉嘓諸羅山亦有倣效者雜記余與黃巖顧敷公過大洲溪厯新港社加溜灣社麻豆社雖皆畨居然嘉木隂森屋宇完潔不減內地村落顧君曰新港加溜灣歐王即蕭壠麻豆於偽鄭時為四大社令其子弟能就鄉孰讀書者蠲其徭欲以漸化之四社畨亦知勤稼穡務蓄積比戶殷富又近郡治習見城市居處禮讓故其俗於諸社為優歐王近海不當孔道尤富庶惜不得見過此恐日遠日陋矣然觀四社男婦被髮不褌猶沿舊習各社終身依婦以處皆以門楣紹瓜瓞父母不得有其子故一再世而孫且不識其祖矣畨人皆無姓氏有以也裨海紀遊新港加溜灣二社為一邑孔道凡奉差至者將照身一出練保人等不知何事并不知何名書則支給酒食夜則安頓館舍然燈進饌折勒規例臨行供應夫車一人必坐一乘日撥數起或二三十起欲概行應付則民力可憐抗阻則獲罪非小東寧政事集四社地邊海空濶諸畨饒裕者中為室四旁列種果木廪囷圈圉次第井井環植藾竹至數十畝諸羅志郡中造船出水最艱所司檄四社畨衆牽挽嵗以為常聞金一鳴鼓力並進事畢官酬以煙布糖丸新港蕭壠麻豆各畨昔住小琉球後遷於此孫元衡加溜社詩自有蠻兒能漢語誰言冠冕不相宜叱牛帶雨晚來急解得沙田種芋時北路諸羅畨二諸羅山哆囉嘓一作倒咯嘓打貓居處結室曰必堵混每興工糾合衆畨互相為力通門於兩脊頭不事繪畫舉家同室而居僅分袵席而已飲食酒二種一用未嫁畨女口嚼糯米藏三日後略有酸味為麯舂碎糯米和麯置甕中數日發氣取出攪水而飲亦名姑待酒一種與新港等社同飯亦如之每年以二月二日為年一社會飲雖有差役不遑顧也衣飾畨婦頭帶小珠曰賓耶産盤髮以青布大如笠頸項圍繞白螺錢曰描打臘男婦衣服黑白俱短至臍掩蔽下體及束腓專用皂布每換年男女艷服簮野花或纒以金絲藤相聚會飲手帶鐵鐲環名曰沙璽卑將散麻達手腕縛草垂地鬬走而歸曰勞羅束隨插此草戶上三日以為大吉社中亦間有效漢人戴帽著鞾者婚嫁婚姻曰帶引那幼畨名搭覔璽初訂姻男家贈頭箍以草為之名搭搭干或以車螯一盂為定將成婚男婦兩家各煩親屬引男至女家婚配通社飲酒相慶名曰馬女無夏男家更以銅鐵手釧及牲醪送女家或夫婦離異男離婦者罰粟十石婦離男者亦如之男未再娶婦不得先嫁反是罰畨錢二圓私通被獲投送土官罰酒豕鳴於衆再罰畨錢二圓未嫁娶之男女不計也哆囉嘓社成婚後男女俱折去上齒各二彼此謹藏以矢終身不易喪葬家有喪曰描描産置死者於地男女環繞一進一退抵掌而哭用木板四片殮葬竹圍之內蓋一小茅屋上插雞毛并小布旗以平生什物之半懸死者屋內喪服披烏布於背或絆烏帶於肩服三月滿夫死婦守喪亦三月即改適先告父母後自擇配與新港等社期年除服先後擇配不同器用捕鹿弓箭及鏢俱以竹為之弓無弰背密纒以藤苧繩為弦漬以鹿血堅韌過絲革射搭箭於左箭舌長二寸至四寸不等傅翎略如漢製而剪其梢鏢桿長五尺許鐵鏃鋒銛長二寸許有雙鈎長繩繫之用時始置箭端遇鹿麂一發即及雖奔逸而繩挂於樹終就獲焉亦用以防夜於竹寮高望巡哨持挨牌以蔽身木皆斜紋箭不能入諸畨與漢人貿易家中什物亦有窰器釜鐺之屬近亦間置桌椅又製葫蘆為行具大者容數斗出則隨身旨蓄毯衣悉納其中遇雨不濡遇水則浮寢以竹片鋪地藉以鹿皮富者列木牀於舍以為觀美夜仍寢於地枕木如小凳附畨歌哆囉嘓社麻達遞送公文歌喝逞唭蘇力我遞公文麻什速唭什速須當緊到沙迷唭呵奄走如飛鳥因忍其描林不敢失落因那唭嚂包通事唭洪喝兜若有遲誤便為通事所罰打貓社畨童夜逰歌麻呵那乃留唎化呢我想汝愛汝麻什緊吁哰化我實心待汝化散務那乃哰麻汝如何愛我麻夏劉哰因那思呂流麻我今回家可將何物贈我諸羅山社豐年歌麻然玲麻什勞林今逢豐年大收蠻南無假思毛者約會社衆宇烈然􅤍沙無嗄都須釀美酒宇烈嘮來奴毛沙喝嘻齊來賽戲麻什描然麻什什願明年還似今年北路諸羅畨三大武郡貓兒干一作麻芝干西螺東螺他里霧猴悶斗六一名柴裏二林南社阿束大突眉裏馬芝遴居處自新港蕭壠麻豆大武郡南社灣裏以至東螺西螺馬芝遴填土為基高可五六尺編竹為壁上覆以茅茅簷深邃垂地過土基方丈雨暘不得侵其下可舂可炊可坐可卧以貯笨車網罟雞塒豕欄架梯入室極高聳宏敞門繪紅毛人像他里霧斗六門亦填基為屋較此則卑狹矣麻達夜宿社寮不家居恐去社遠致妨公務也飲食飯一白占米清晨煮熟置小藤籃內名霞籃或午或晚臨食時沃以水一糯米炊蒸為飯製酒與哆囉嘓諸社同每年以黍熟時為節先期定日令麻達於高處傳呼約期會飲男女著新衣連手踏地歌呼嗚嗚捕鹿採魚自新港以至淡水俱相等各社俱不敢食犬東西螺食豬肉連毛燔燎肝則生食肺腸則熟而食之二林捕魚畨婦或十餘或數十於溪中用竹籠套於右胯衆畨持竹竿從上流驅魚畨婦齊起齊落扣魚籠內以手取之衣飾衣達戈紋用苧織成領用茜毛織以紅紋為衣長只尺餘釘以排扣下體用烏布為蔽長二尺餘炎天則結麻片為之縷縷四垂圍繞下體以為涼爽且便於渡水他里霧以上多為大耳其始先用線穿耳後用蠔殼灰漆木或螺錢或竹圈用白紙裹之塞於兩耳名曰馬卓祼人叢笑篇云畨造大耳幼鑽囷實以竹圈自少至壯漸大如盤汚以土粉取飾觀云或云畨婦最喜男子耳垂至肩故競為之二林不為大耳皆帶銅錫墜長衣麻達頂髮分兩邊梳結兩髻曰對對東西螺畨幼時剃髮約十餘嵗留髮待成婚後剃去周圍之髮所留頂髮較辮稍大臂腕束以鐵釧有兩手用五六十者或用蛤釧或縛手腕以草長垂至地如麈拂狀曰下侯落編篾束腹每倒身為之以圖就細凡差役皆麻達所任束腹奔走倍為趫捷成婚則去之馬芝遴畨頭帶木梳或插竹簮或插螺簮鹿角簮名曰夏基網婚嫁自幼訂姻用螺錢名阿里捫及筓女家送飯與男家男家亦如之定婚期畨媒於五更引壻至其家天明告其親宴飲稱賀亦有不用定聘薄暮男女梳粧結髮遍社戲遊互以嘴琴挑之合意遂成夫婦琴以竹為弓長可四寸虛其中二寸許釘以銅片叧繫一小柄以手為往復脣鼓動之其俗惟長男娶婦於家餘則出贅南社畨夫婦雖反目終不離異下四社任意離合東螺社幼時兩家倩媒説合男家用螺錢三五枚為定娶時再用數錢或姊妹妯娌迎新婦入門男女並坐杵臼上移時而起女戴搭搭干用篾為之嵌以蛤圈及燒石珠插以雉尾為飾三日後新婦隨姑請母氏會飲喪葬父母死服皂衣守喪三月尸瘞厝邊富者棺木貧者草席或鹿皮襯土而殯生前什物俱殉其半器用出入必佩小刀舍中置鹿頭角有疾者沐髮用以擊之即瘥夜無燈用松木片植石上然之名搭貯屢畨婦用圓木挖空為機圍三尺許函口如槽名普魯以苧麻捻線或用犬毛為之橫竹木桿於機內卷舒其經綴線為綜擲緯而織名達戈紋又織麻布名老佛鼻簫長可二尺亦有長三尺者截竹竅四孔通小孔於竹節之首用鼻橫吹之或如簫直吹名獨薩里又打布魯以木為之如嗩呐狀聲亦相似皆麻達遊戲之具附畨歌大武郡社捕鹿歌覺夫麻熙蠻乙丹今日歡會飲酒麻覺音那麻嘈斗六府嗎明日及早捕鹿麻熙棉達仔斗描回到社中描音那呵隴仔斗六府嗎人人都要得鹿斗六府嗎麻力擺鄰隨將鹿易銀完餉嗄隨窪頑熙蠻乙餉完再來會飲二林馬芝遴貓兒干大突四社納餉歌吧圓吧達敘每鄰耕田園其嗎耶珍那愛好年景夫甲馬溜文蘭捕鹿去其文蘭株屢鹿不得逸甘換溜沙麻力岐甘換易餉銀得早完餉馬尤㖿哰㖿其唎印㖿可邀老爺愛惜圍含呵煞平萬㖿嗥其喃買逸我等回來快樂飲酒酣歌南社會飲歌吧老灣唭嗎流末矢耕田園遇好年嵗吧思沙螺吧思轆鎖收得麻收得米馬溜文蘭唭打咳捕得鹿且多打茅打奈打匏公申㖿奢父子祖孫齊來飲酒招彌流嗥唭喃買逸歡呼歌唱為樂他里霧社土官認餉歌礁包須嗎喝嘶連請社衆聽説因納率束呀通事罕餉我今同通事認餉因許麻吧那爾等須耕種愛化美忝無那切勿飲酒失時間那束呀罕餉切㖿俟認餉畢閔留美忝喃㖿麼請爾等來飲酒斗六門社娶妻自誦歌夜描拔屢描下女今日我娶妻别言毛哈㖿呼請來飲酒尤㖿描咿林尤林日後我生子生孫由拔屢别言毛哈㖿呼再娶妻又請來飲酒東西螺度年歌吧園吧達敘每鄰無那耕田園馬流平㖿珍那麻留呵嗒愛年嵗收成夫甲馬溜文蘭捕鹿甘換麻文欣麻力易銀完餉密林嗎流㖿嗥喡含可去釀酒過年阿束社誦祖歌嗎留耶茅務嗎吧那我祖翁最勇猛麻里末文蘭布務務巴那遇鹿能活捉吧出呂唭甲買打招鬬走直同於馬布務務勃呵沙彌酣遇酒縱飲不醉附載大武郡之女時以細砂礪齒望若編貝外紀大武郡社文身者愈多耳輪漸大如碗獨於髮加束或為三叉或為雙角叉以雞尾三羽為一翿插髻上迎風招颭以為觀美稗海紀遊東西螺以北番好飼馬不鞍而馳驟要狡獸捷輕禽豐草長林屈曲如意擇牝之良者倍價而易之以圖孶息斗六門舊有畨長能占休咎善射日率諸畨出捕鹿諸畨苦焉共謀殺之血滴草草為之赤社草皆赤諸畨悉以疫死無噍類今斗六門之畨皆他社來居者諸羅志臺灣令周鍾瑄詳藁估修船料悉取材於大武郡社山去府治四百餘里鋸匠人夫日以數百計為工須數閲月每屬工人具領官價才十餘兩尚不足支一日之費凡食用雇夫等項每匠勻𣲖以補不足工完方止此為工匠之苦工料辦齊郡縣檄催每縣約需車四百輛每輛計銀三兩五錢照丁𣲖銀保大丁多者每丁𣲖至三錢保小丁少者𣲖四丁一輛是每丁出銀八錢合計四縣共𣲖四千有零所領官價才每屬三十餘金此為里民之苦至重料悉𣲖畨運內中如龍骨一根須牛五十餘頭方能拖載而梁頭木舵亦復如之一經興工畨民男婦日夜不寧計自山至府若遇晴明半月方至此為畨民之苦今嵗估修不過數隻害己如此若明嵗大修三十餘隻臺屬遺黎恐難承受不去為盜有相率而死耳當事允其請力為禁止東螺貓兒干間有讀書識字之畨有能背誦毛詩者口齒頗真往來牌票亦能句讀阿束畨童舉略讀下論志大諳栖俱讀上論并能默寫蒙師謂諸童聰慧日課可兩頁但力役紛然時作時輟不能底於有成耳舊阿束社於康熙五十七年大肚溪漲幾遭淹沒因移居山岡今經其地社寮就傾而竹圍尚鬱然蔥蒨也過此則極目豐草高沒人身中有車路荒榛埋輪涉大肚溪行山麓間竹樹蔽虧逺岫若屏幾不知為文身之鄉矣斗六門舊社去柴裏十餘里在大山之麓數被野畨侵殺後乃移出今舊社竹圍甚茂因以為利逐年土官𣲖撥老畨數人更畨輪守孫元衡過他里霧詩翠竹隂隂散犬羊蠻兒結屋小如箱年來不用愁兵馬海外青山盡大唐畨稱內地為唐舊有唐人三兩家家家竹徑自回斜小堂蓋瓦窗明紙門外檳榔新作花還過他里霧林黑澗逾響天青山更高諸畨能跪拜前隊肅弓刀卧簟惟功狗畨人最珍猛犬喧枝盡伯勞林無他鳥惟伯勞爭鳴不因程計日待獵看風毛西螺北行秋隂近午喜妍和緑野空明霽色多雲盡山低應到海沙奔水亂各成河蠻陬蠢蠢妻和子舌語醒醒嘯且歌未解卜居何地好略關形勝有干戈余壬寅仲冬過斗六門作墻隂蕉葉依然緑壠畔桃花自在紅冬仲何殊春候暖蠻娘嬉笑竹圍東北路諸羅畨四大傑巔大武壠噍吧年木岡茅匏頭社即大年哰加拔一作茄苃霄裏夢明明自頭社以下皆生畨居處住室曰達勞平地築土作基大木為梁銼竹結椽桷為蓋衆擎而覆之落成全室歡飲飲食飯漬米水中經宿雞鳴蒸熟食時和以水糯少則兼食黍米酒用糯米炊熟燒禾草作麯攪米飯藏甕中過六日取出沃水而飲魚蝦鹿麂俱生食衣飾畨男以布八尺圍身曰羅翁腰以下用四尺圍蔽或以達戈紋緣領畨婦項帶珠串曰麻海譯手足腕俱束以銅圈曰堵生聲遇吉事則衣皆白色羣聚飲啖醉後歌唱跳舞以為樂婚嫁娶妻曰匏冶需未娶婦曰隹老歪賀新婚曰備力力其搭學其俗先通後娶將娶則送珠仔為定名曰毛里革用木匱置布匹達戈紋送至女家三日後置酒大會女家亦邀會飲夫婦相離曰放手男未再娶女不敢嫁先嫁者罰牛豕不等通姦被獲鳴衆聲罪罰以酒豕未嫁娶男女罰依前例喪葬番死名麻八歹富未葬時在社鳴鑼喪家披髮皂布裹頭面止露兩目親屬酹死者以酒哭盡哀以大窑缸作棺瘞本厝內夫死一月服滿婦告父母他適器用飲食無碗箸用匏斗狀如葫蘆口小腹大可藏米數斗各社皆有大武壠礁吧年二社尤多貯物用筐及藤籃耕種則用刀斧斫伐樹根栽種薯芋亦有填築薄岸為田播插稻秧者附畨歌大傑巔社祝年歌臨臨其斗寅今過年尋㖿唭什剝格唭圭甲為粉餈殺雞施里西奇文林祭天地匏打鄰其斗寅麻亮其斗寅祝新年勝去年嗒學嗄葛唭唹因倍收穫食不盡大武壠社耕捕會飲歌毛務麻亮其斗寅耕種勝往年遏投嗎㖨務那其壘同去打鹿莫遇生畨媽毛買仍艾竒打㖨社衆可釀美酒美樂哄密嗒竒打㖨嗎萌齊來乘興飲酒至醉附載大武壠內社九大離蚌社礁吧年社邦鶻社內踏綱社敦里礁吧裏社萬打籠社藤橋頭社內優社美壠社諸羅志大武壠南為八里打難東為達里打猿俱生畨與傀儡畨通羅漢內門外門田皆大傑巔社地也康熙四十二年臺諸民人招汀州屬縣民墾治自後往來漸衆耕種採樵每被土畨鏢殺或放火燒死割去頭顱官辨詰捕而相近者為木岡武洛大澤機遠之為內幽諸社生畨環聚緝治為艱立界絶其出入可以杜患矣莊秀才子洪云康熙三十八年郡民謝鸞謝鳳偕堪輿至羅漢門卜地歸家俱病醫療罔效後始悟前曾乞火於大傑巔畨婦必為設向適郡中有漢人娶畨婦者因求解於婦隨以口吮鸞鳯臍中各出草一莖尋愈畨婦自言初學咒時坐卧良久如一樹在前卧而誦向樹立死方為有靈諸羅志作法詛咒名向先試樹木立死解而復蘇然後用之不則恐能向不能解也入舍無敢胠篋探囊擅其技者多老畨婦田園阡陌數尺一杙環以繩雖山豕麋鹿弗敢入漢人初至摘啖果蓏脣立腫求其主解之轉瞬平復如初近年附郭諸社畏法不敢為稍遠則各社皆有或於笭箵中取鵝卵石置於地能令飛走喝之則止北路諸羅畨五內優一作內幽附大武壠納餉壠社屯社綱社美壠自壠社以下俱生畨居處倚山掘土狀若穴居以沙石版代磚瓦或用木及茅竿草為之闊不一式高不盈丈生畜俱養於內子女嫁娶則叧築之飲食疊巘深溪樹木蓊蘙平原絶少山盡沙石種黍秫薯芋俱於石罅鑿孔栽植黍秫熟留以作酒先以水漬透畨婦口嚼成粉置甕中或入竹筒亦用黍稈燒灰攪成米麯發時飯或黍秫和入旬日便成新酒客至漉糟畨輪飲之遠出則開鑿地穴置芋薯於中火煨以土覆之隨手取食可代餱糧射生禽鏢麋鹿炙而食之生亦不厭也衣飾男女多著鹿皮或織樹皮苧麻為布極粗厚日以作􅥶夜以覆體今與漢人交易布匹男以布尺餘遮前後體畢露以皮為帽不畏荆棘吉事則以鳥羽為飾婦俱以布裹頭婚嫁男女私合父母知之則飲會議婚同飲者倩一人為媒遂定偶工作之暇兩家訂期釀酒成婚或娶或贅不等喪葬男婦彌留將生平所有之衣盡著於體既死衣盡脫去裸葬厝內哀哭數日無居喪儀節器用耕田用小鋤或將堅木炙火為鑿以代農器短刀鏢箭與衆社無異北路諸羅畨六南投北投貓羅半線柴仔坑水裏居處屋曰夏堵混以草為蓋或木或竹為柱厝蓋葺茅編成邀衆畨合於脊上大小同居一室惟未嫁者另居一舍曰貓鄰飲食食米二種一占米一糯米每晨淘淨入籃筐內置釜蒸食外出裹腰間手取食之為酒亦如內優等社魚蝦鹿肉等物先炙熟再於釜內煎煮半線以北取海泥鹵曝為鹽色黑味苦名幾魯以醃魚蝦衣飾衣用達戈紋或衣皂布白布俱短至臍每年二月間力田之候名換年男女俱衣雜色綢紵紅襖曰包練或粧蟒錦繡為之畨婦頭帶紗頭箍名答答悠用白獅犬毛作線織如帶寬二寸餘嵌以米珠飲酒嫁娶時戴之畨最重此犬發縱指示百不失一或以牛易之尚有難色項挂衣堵瑪瑙珠名眉打喇螺錢名數十人挽手而唱歌呼踏蹄音頗哀怨麻達兩耳如環實以木板螺殼已娶者曰老纎則去塞耳以分别長幼半線以上多揉樹皮為裙白如苧曉行以禦湛露晞則褪之諸羅志婚嫁婚姻曰綿堵混未娶婦曰打貓堵男家父母先以犬毛紗頭箍為定或送糯飯長則倩媒娶時宰割牛豕會衆敘飲男贅女家亦如之如有兩女一女招男生子則家業悉歸之一女即移出如無子仍同居社寮夫婦反目男離婦必婦嫁而後再娶婦離男必男娶而後再嫁違則罰牛一隻車一輛通姦被獲男女各罰牛車未嫁娶者不禁半線社多與漢人結為副遁副遁者盟弟兄也漢人利其所有托畨婦為媒先與本婦議明以布數匹送婦父母與其夫結為副遁出入無忌貓兒干東西螺大武郡等社亦踵此惡習但不似半線太甚耳喪葬畨死老幼裹以草席瘞本厝內平生衣物為殉親屬葬畢必浴身始入厝喪家不為喪服十日不出戶衆畨呼為馬鄰夫亡婦改適必逾兩月告知父母舅姑許諾乃擇配器用耕種捕鹿具與衆畨同惟採魚兼用篾篙炊以三石塊為竈螺蛤殼為碗竹筒為汲桶附畨歌南北投社賀新婚歌引老綸堵混爾新娶妻其衣堵眉打喇我裝珠飾貝蠻乙丹綸堵混慶賀新婚引老覺夫麻熙蠻乙丹爾須留我飲賀酒半線社聚飲歌真角夫甲文南捕得鹿支備辰呵打收得米密林嗎流呵嗥做下酒保務務其阿肖萬什呵嗥社衆齊來賽戲會飲附載半線畨童楚善讀下孟大眉盈之俱讀下論宗夏讀上論商國讀大學山有野牛民間有購者衆畨乘馬追捕售之價減熟牛一半余晚次半線作憶昔歷下行龍山豁我情今茲半線遊秀色欲與爭林木正蓊蘙嵐光映晚晴重岡如回抱澗溪清一泓北為大肚溪里社數百家對宇復望衡畨長羅拜跪竹綵貌童迎麻達用雙竹結紅綵以迎女娘齊度曲俯首欸噫鳴畨歌先以欸噫發聲瓔珞垂項領跣足舞輕盈鬬捷看麻達飄颻雙羽橫薩豉聲鏗鏘薩豉宜見前奮臂為朱英紅布懸竹竿為幟麻達先至者奪之王化真無外裸人雜我氓安得置長吏華風漸可成臺海使槎録卷五
