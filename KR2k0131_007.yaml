body:
  text: 臺海使槎録卷七常鎮揚通道黄叔璥撰南路鳯山畨一上淡水一名大木連下淡水一名麻里麻崙阿猴搭樓茄藤一名奢連放䌇一名阿加武洛一名大澤機一名尖山仔力力居處屋名曰朗築土為基架竹為樑葺茅為蓋編竹為牆織蓬為門每築一室衆畨鳩工協成無工師匠氏之費無斧斤鋸鑿之煩用刀一柄可成衆室正屋起脊圏竹裹草標左右如獸吻狀名曰律武洛名曰打藍示觀美也社四圍植竹木貯米叧為小室名曰圭茅或方或圓或三五間十餘間毗連亦以竹草成之基高倍於常屋下木上簟積榖於上每間可容三百餘石正供收入遞年輪換夜則鳴鑼巡守雖風雨無間也飲食種秔稻黍糯白豆菉豆畨薯又有香米倍長大味醇氣馥為飯逾二三日香美不餲每嵗種植只供一年自食不交易價雖數倍不售也嵗時宴會魚肉雞黍每味重設大會則用豕一不治别具飲酒不醉興酣則起而歌而舞舞無錦繡被體或著短衣或袒胸背跳躍盤旋如兒戲狀歌無常曲就見在景作曼聲一人歌羣拍手而和捕鹿除鹿臟外筋肉悉呈土官近畨以鹿易酒將捕鹿先聽鳥音占吉凶鳥色白尾長即蓽雀也畨曰蠻任音宏亮吉㣲細凶食物餒敗生蟲欣然食之酒以味酸為醇漢人至則酌以待歡甚出畨婦侑酒或六七人十餘人各斟滿椀以進客逐椀皆飲衆婦歡然而退倘前進者飲後進者辭遂分榮辱矣客惟盡辭不飲為善衣飾男裸全體女露上身自歸版圖後女著衣裙裹雙脛男用鹿皮蔽體或氊披身名卓戈紋青布圍腰下即桶裙也名抄陰武洛曰阿習俱赤脚土官有著履者男女喜簮野花圍繞頭上名蛤網挿雞羽名莫良武洛曰伊習力力曰馬甲奴葛猶漢言齊整也性好潔冬夏男女日一浴赤體危立以盂水從首淋下拭以布或浴於溪用鹿豕脂潤髪名奇馬恐髪散垂各以青布纒頭或以草冬夏不除近亦有戴帽者剃頭編辮者㧞髭鬚名心力其莪莪愛少惡老長鬚者雖少亦老至頭白不留一鬚每日取草擦齒愈黑愈固項懸螺錢名興那手帶銅鐲或鐵環名圭留力力社曰勞㧞脚帶鐵鐲名石加來皆以飾美故男女并帶之又麻達用咬根任即薩豉宜擊鐲鳴聲叧用鐵片繫腰間以助韻傳送文移行愈疾聲愈遠謂暮夜有惡物阻道恃以不恐穿耳惟茄藤放䌇力力三社或以木貫之名勞宇婚嫁不擇婚不倩媒妁女及笄構屋獨居畨童有意者彈嘴琴逗之琴削竹為弓長尺餘以絲線為絃一頭以薄篾折而環其端承於近弰絃末疉繫於弓面齩其背爪其絃自成一音名曰突肉意合女出而招之同居曰牽手逾月各告於父母以紗帕青紅布為聘富者用紗帕貧惟青紅布女父母具牲醪會諸親以贅焉謂子曰安六壻亦同之既婚女赴男家洒掃屋舍三日名曰烏合此後男歸女家同耕並作以諧終身夫婦反目夫出其婦婦離其夫不論有無生育均分舍内什物各再牽手出贅近日畨女多與漢人牽手者媒妁聘娶文又加煩矣䘮塟土官故掛藍布旛竿鳴鑼轝屍遍遊通社名曰班柔少里堂敖敖通社閉戸尸遊歸家用板合成一盝置屍於内殮以平日衣服什物各半諸親各送青藍布一丈或鹿皮一張同什物與盝塟所卧床下妻子遷居别室本家及親友各酹以酒奠畢錮其户歸無論老少仍别牽手其子孫則胷背披藍布二片謂之掛孝約及期年去之餘畨有䘮悉如土官惟不敢游屍耳器用飲食用椰瓢名奇麟不用箸以手攫取近亦用粗椀名其矢竹箸名甘直竈支三木泥以土或用石甃名曰六難鍋曰巴六汲水用大葫蘆曰大蒲崙近亦用木桶坐皆席地或藉鹿皮飲食宴會蹲踞而食近始製桌椅以待客畨衆仍架竹為凳而蹲踞席地之風少減矣衣糧多貯葫蘆内遠出亦擔以載行衣近行用竹筒名斗籠貯香米飯以禦饑又編竹為霞籃其制圓小者容一二斗大者可三四石畨無升斗以此槩米粟黍豆多寡與北路大肚諸社同藤籠以藤為之有底有蓋或方或圓或似豬腰形用以貯物至弓矢鏢槊亦與北路同刀長止尺許或齊頭或尖葉函以木鞘男婦外出繫於腰間以堅木為木牌高三尺餘濶二尺繪畫雲鳥以蔽身附畨歌上淡水力田歌咳呵呵里慢里慢那毛呵埋此時係畊田之候唭唹老唭描嗄咳天今下雨唭吧伊加圭朗煙及時畊種唭麻列唭呵女門下秧鋤草唭描螺螺嗄連好雨節次來了唭麻萬列其嘻列播田明白好來飲酒下淡水頌祖歌巴干拉呀拉呀留請爾等坐聽礁眉漢連多羅我洛論我祖先如同大魚礁眉呵干洛呵連凡行走必在前呵吱媽描歪呵連刀何等英雄唹嗎礁卓舉呀連呵吱嗎如今我輩子孫不肖無羅嗄連如風隨舞巴干拉呀拉呀留請爾等坐聽阿猴頌祖歌咳呵呵咳仔滴唹老論我祖振芒唭紏連實是好漢礁呵留的乜乜衆畨無敵礁留乜乜連誰敢相爭搭樓念祖被水歌咳呵呵咳呵嗄此係起曲之調加斗寅祖公時嗎搏唭嘮濃被水冲擊搭學唭施仔捧衆畨就走磨葛多務根走上山内佳史其加顯加㗀無有柴米佳史唭唹嗎也無田園麻踏堀其搭學衆畨好艱苦茄藤飲酒歌近呵欸其歪請同來飲酒礁年臨萬臨萬其歪同坐同飲描呵那哆描呵欸不醉無歸代來那其歪荅曰多謝汝嘻哆萬那呵欸其歪如今好去游戲龜描呵滿礁呵欸其歪若不同去游戲便回家去放䌇種薑歌粘粘到落其武難馬涼道毛呀覔其唹嗎此時是三月天好去犂園武朗弋礁拉老歪礁嗎嗼不論男女老幼免洗温毛雅覔刀嗎林唭萬萬同去犂園好種薑嗎米唭萬萬吧唎陽午凉藹米唭唎呵俟薑出後再來飲酒武洛頌祖歌嘻呵浩孩耶嗄此句係起曲之調乜連糾先時節鎮唎烏留岐跌㖿我祖先能敵傀儡那唎平奇腰眉聞風可畏鎮仔奇腰眉如今傀儡尚懼唭耳奄耳奄罩散嗄不敢侵越我界力力飲酒捕鹿歌文嘮唭啞奢來賽戲丹領唭漫漫種了薑排裏唭黎唉去換糯米伊弄唭嘮力來釀酒麻骨裏唭嘮力釀成好酒匏黍其麻因刃臨萬唭嘮力請土官來飲酒媽良唭嘮力酒足後毛丙力唭文蘭去捕鹿毛里居唭丙力捕鹿囘文嘮唭啞奢復來賽戲附載土官有正副大社五六人小社三四人各分公廨管事頭目亦稱公廨有事則集衆以議能書紅毛字者號曰教册掌登出入之數削鵝毛管濡墨横書自左而右由淡水入深山番狀如猿猱長僅三四尺語與外社不通見人則升樹杪人視之則張弓相向鳯山志鳯山一邑倉穀多於淡水各社堆貯修葢倉厫悉令土畨繕治已屬𣲖累至司納出入有社房有對差或經管僕役諸畨原不與聞及遇黴黰兼之猴䑕侵耗或官吏侵盜缺少俱責令各畨賠補從前有司總利畨民蚩愚剝削侵吞苦累實甚余飭所司倉厫祗許令土畨在外協同看䕶至倉内榖石及修理倉房不得混𣲖一粟一木稍知警惕小琉球社對東港地廣約二十餘里久無畨社餉同瑯嶠卑南覔皆邑令代輸山多林木採薪者乗小艇登岸水深難於維繫將舟牽拽岸上結寮而居近因偵緝餘孽所司絶其往來矣南路畨童習漢書者曾令背誦黙寫上淡水施仔洛讀至離婁人孕礁巴加貓讀左傳鄭伯克段於鄢竟能黙寫全篇下淡水加貓礁加里文郎讀四書毛詩亦能摘録加貓讀至先進礁恭讀大學放䌇社呵里莫讀中庸搭樓社山里貓老讀論語皆能手書姓名加貓於紙尾書字完呈上指日榮陞數字尤為畨童中善解事者武洛社八社中最小性鷙悍逼近傀儡山先是傀儡生畨欺其社小人㣲欲滅之土官糾集社畨往鬬大敗生畨戮其衆無算由是傀儡懾服不敢窺境其子孫作歌以頌祖功冬春捕鹿採薪羣歌相和音極亢烈生畨聞之知為武洛社畨無敢出以攖其鋒者余詩云發聲一唱競嘻呵不解腰眉語疉何傀儡深藏那敢出為聞武洛採薪歌黄吳祚咏上淡水八社二首初冬出草入山深先向林間聽鳥音蓽雀飛來音較亮諸畨競奮逐前禽社中留客勸銜杯諸婦相將送酒來誤進一杯須盡飲漫分辭受起嫌猜南路鳯山傀儡畨二北葉安心武里北葉分出山豬毛加蚌一作泵加務朗勃朗一名錫干施一作系汝臘山里老一名山里留加少山七齒岸一云即施汝臘未知孰是加六堂礁嘮其難一名陳那加勿陳阿修一名八絲力以上熟畨加走山礁網曷氏系率臘毛系系望仔立加籠雅無朗逸山里目佳者惹葉擺律柯覔則加則加單以上新附畨傀儡生畨動輒殺人割首以去髑髏用金飾以為寶志言之矣被殺之畨其子嗣於四個月釋服後必出殺人取首級以祭大武力力尤鷙悍以故無敢輕厯其境飲食居處傳説不一有云若輩在深山中首蒙鹿皮胷背間用熊皮蔽之喜食大龜用火炙熟刀劈啖之以殻為什器龜卵剝去軟皮和鹽少許而食麞鹿取其肉用石壓去血水曬乾出山易鹽布米珠遇鐵及鉛子火藥雖傾其所有以易不顧也芋極長大而細膩畨以為糧熟後隂乾每食少許以水下之可終日不食或云武力社率芒社𤓰覔社厯厯社七脚亭社擺律社加籠雅社無朗逸社望仔立社勃朗社陳那加勿社陳阿修社加務朗社董滴社加蚌社加少山社毛系系社礁網曷氏社龜嘮律社為港東里十九社加走山社系汝臘社系率臘社七齒岸社北葉社心武里社山里老社八歹社加者膀眼社拜完社山豬毛社山里目社力力喇社為港西里十三社鳯山通事外委鄭宇云礁巴覔曾轄六社山豬毛社山里目社賓嘮龜臘社大解懷社毛那難社加知務難社加務朗社轄三社柯覓社擺律社君崙留社擺灣社轄十二社礁巴覔工社山嘮老社加查青難社陳阿少里社加力氏社加則難社八歹因社礁來搭來社加老律社加者膀眼社知嘮曰氏社君云樓社佳者惹葉社轄十一社山里留社加少山社陳阿難益難社擺也也社加走山社則加則加單社大文里社貓美加社思里思里莫社施汝臘社卒武里社加蚌社轄九社礁網曷氏社施率臘社毛系系社嘮律目社施羅滿社礁嘮其難社八絲力社加籠雅社勃朗錫干社望仔立社轄二社無朗逸社七脚亭社又厯厯社董底社萬屢屢社屬山後卑南覔社社轄共六十八社又見别圖有黎嶺社懷仔社加人工社山務諧社山卓考社或又云共七十二社層巖疊岫人蹟罕經得之傳聞無所證據兹盡為録出以俟後之留心採訪者雍正癸卯秋心武里女土官蘭雷為客民殺死八歹社加者膀眼社率領畨衆數百暗伏東勢莊殺死客民三人割頭顱以去文武宣示兵威勒緝兇畨兩社遯逃僅得二髑髏以歸維時附近生畨加走山社礁網曷氏社系率臘社毛系系社望仔立社加籠雅社無朗逸社山里目社呈送畨豕卓戈紋畨籃蓋願來歸化計七百餘口各社嵗輸鹿皮五張不衣不袴惟於私處以布圍繞土官衣狀如毠㲚風吹四肢畢露毛系系社女土官弟勞里阮頭帶竹方架四圍用紅雨纓織成中有黄花紋遠望如錦纒繞竹上名達拉嗎亦有飾以孔雀毛者云非土官不敢加首甲辰四月舊歸化山里留社土官珍里覔挈佳者惹葉社公廨蘭朗則加則加單社公廨礁鹿子卓擺律社副土官彩文柯覔社公廨佘基卯等獻送戶口册共五百二十名口附貢迦喇巴篾籃蓋八咿洞即卓戈紋四畨豕二據稱聖天子愛飬黎元下逮畨庶聞風歸化土官内有戴豹皮帽者名力居樓大羅房如豹頭形眼中嵌玻璃片週圍飾以朱英帽後綴以豹尾亦有戴頭箍者名奥曼插以鳥羽十餘枝參差排列垂髪二縷云係其妻之髪衣熊豹皮名曰褚買内披短衣曰鴿覔下體盡露惟於私處圍烏布一片名曰突勿亦有胸前搭紅緑卓戈紋者名曰噶拉禄用紅嗶吱折碎間以草絲畨婦用口染成青緑經緯錯綜頗為堅緻各佩一刀名曰奪佳叧有網袋名細敲皮袋名落母皆以貯行裝者鳳山令楊毓健令鄭宇撫和生畨往來傀儡山風土性情言之極詳因述其畧鳯邑東南一帶嶃巖㟥嵳足蹟不至山前則加蚌山豬毛望仔立等七十二社上連諸羅之務來優下及鳯山之謝必益山後則卑南覔七十二社北通崇爻南極琅嶠悉為傀儡畨巢穴每社各土官一仍有副土官公廨小社僅一土官大社轄十餘社或數社不一共五十四社他如謝必益轄四社琅嶠轄十四社卑南覔轄六十八社崇爻轄四社山前山後社百四十有奇其居處悉於山凹險隘處以小石片築為牆壁大木為樑大枋為桷鑿石為瓦不慮風雨惟患地震大枋大石為牀畨布為裀食用器具以藤篾為筐為椀為缽為杓為箸種薯芋黍米以充食種時男婦老幼偕往無牛隻犂耙惟用鐵錐鋤鑿栽種芋熟置大竹扁上火焙成乾以為終嵗之需外出亦資為餱糧農事之暇男則採藤編籃砍木鑿盆女則績苧織布惟土官家織紅藍色布及帶頭織人面形餘則不敢各社生畨持與熟畨交易珠布鹽鐵熟畨出與通事交易土官畜雞犬却不食餘畨則以竹木及豢豕捕獸為活下山則腰佩短刀手執鏢槊竹箭木牌等械背負網袋内貯貨物披髪裸身下體烏布圍遮隆冬以野獸皮為衣熊皮非土官不敢服天雨則以槺榔葉為衣為笠天旱亦祈禱通社男女五日不出門不舉火不食煙惟食芋乾得雨後亦不出門五日謝雨名曰起向各社頭皆留髪剪與眉齊草箍似帽以野草黑齒兩耳穴孔用篾圏抵塞土官副官公廨至娶妻後即於肩背胸膛手臂兩腋以鍼刺花用黑煙文之正土官刺人形副土官公廨祗刺墨花而已女土官肩背手掌亦刺墨花此即尊卑之别捕鹿射獵以鹿皮為袴為履鏢刀弓矢皆所自製最喜鼎鐺銅鐵米珠鹽布嗶吱梳枇親朋相見以鼻彼此相就一㸃小畨見土官以鼻向土官項後髪際一㸃凡所轄社小畨栽種黍米薯芋土官抽取十分之二至射獵麞鹿山豬等獸土官得後一蹄凡嫁娶則以鼎珠刀布為聘土官取其半山前山後諸社例於五年土官暨衆畨百十圍遶各執長竹竿一人以藤毬上擲競以長竿刺之中者為勝畨衆捧酒為賀名曰托高會酒酣各矜豪勇以殺人頭多者為雄長故殺人之案嵗不絶書今歸化生畨習已盡易畨婦俱以鞦韆為戲各社戸前因大樹縛藤縱送為樂日夕歌唱不絶口散髪鬔鬆短衣跣足外出掘薯收芋衣物俱於網袋貯之行戴於首未婚時男女歌唱相合男隨女肩水負薪意既投始告父母聘之反目即時分離男再娶女别嫁土官彼此結姻不與衆畨婚娶歸化畨女亦有與漢人為妻室者往來倍親宻土官故無論男女總以長者承嗣長男則娶婦長女則贅壻家業盡付之甥即為孫以衍後嗣無姓氏三世外即互相嫁娶孫祖或至同名子多者名或與伯叔同父母兄弟故家業器用一家均分死者亦一分埋塟於屋内挖穴四圍立石先後死者次第坐塟穴中無棺木只以畨布包裹其一分物件置尸側大石為蓋米粥和柴灰粘石罅使穢氣不泄婦産死山頂叧開一堀埋之本社有䘮通社男女為服二十餘日親屬六月土官死則本社及所屬各社老幼亦服六月其服身首纒披烏布通社不飲酒不歌唱父母之服長男長女身披烏布頭荷斗笠謂不敢見天也服滿射鹿飲酒除烏布謂之撤服嵗時以黍米熟為一年月圓為一月語與八社異有事他出聽鳥音吉則趨凶則返酒以黍米合青草花同舂草葉包煑四五日外清水漉之貯甕一二日即有酒味聚飲以木椀盛酒土官先酌次及副土官公廨衆畨相繼而飲社畨間有角口無相毆者有犯土官令公廨持竹木横擊將其器物盡為棄擲卑南覔社有犯及獲獸不與豚蹄以背叛論即殺之畨貧莫如傀儡而負嵎蟠踞自昔為然紅毛偽鄭屢思勦除居高負險數戰不利率皆中止近則種類漸多野性難馴且幼習鏢刀拈弓矢輕禽狡獸鏢箭一發無逸兇頑嗜殺實為化外異類今聖明臨御惠澤廣被有血氣莫不尊親雖蠻貊悍輕亦知向化源源來歸非强致也南路鳳山瑯嶠十八社三謝必益豬嘮鋉一名地藍松小麻利一名貓籠逸一名貓蘭施那格貓裏踏寶刀牡丹蒙率㧞蟯龍鸞貓仔上懷下懷龜仔律竹猴洞大龜文或云傀儡柯律居處築厝於巖洞以石為垣以木為樑葢薄石板於厝上厝名打包前後栽植檳榔蔞藤至種芋藝黍時更於山下𥪡竹為牆取草遮葢以為棲止收穫畢仍歸山間飲食諸畨傍巖而居或叢處内山五穀絶少斫樹燔根以種芋魁大者七八觔貯以為糧收芋時穴為窖積薪燒炭置芋灰中仍覆以土聚一社之衆發而噉焉甲盡則乙不分彼此日凡三餐不食鷄有傳紅毛欲殺生畨俱避禍逺匿聞雞聲知其所在逐而殺之畨以為神故不食深山捕鹿不計日期饑則生薑嚼水佐以草木之實云可支一月或以煨芋為糧無火則取竹木相鋸而出火海邊多石各畨於空洞處傾曬海水成鹽收米三次為三年則大會束草為人頭擲於空中各畨削竹為槍迎而刺之中者為麻丹畢華言好漢也各畨以酒相慶三日乃止與傀儡畧同衣飾男婦用自織布圍繞曰張面婦短衣曰鴿肉男短衣曰瑯袍剪紙條垂首曰加篤北或為草箍束髪曰臘手足亦用銅鐲曰打臘或以鹿尾束脛曰打割出入負鹿皮日藉以坐夜則寢之婚嫁各畨結婚不問伯叔之子自相配偶惟土官則不與衆畨為婚男女於山間彈嘴琴歌唱相和意投則野合各以佩物相貽歸告父母土官叧期具豕酒會土官親戚贅入婦家反目男再娶婦將所生子女别醮其俗重母不重父同母異父俱為同胞同父異母直如陌路呼父曰阿媽稱叔伯母舅如之呼母曰惟那稱嬸母及妗亦如之夫婦相稱以名産後同所生子浴於溪中與北路同一産二男為不祥將所産子縛於樹梢至死并移居他處瑯嶠一社喜與漢人為婚以青布四疋小鐵鐺一口米珠觔許為聘臨期備牲醪白之所親及土官成婚畨無姓名以父名為姓以祖名為名如祖名甲父名乙即以乙為姓甲為名衆畨呼曰乙礁巴甲礁巴者畨人口吻語䘮塟畨死厝内築石洞以塟石板封固生者不别遷䘮服則衣白褂圍白布與别社以烏布為服又不同器用社内有製牀者名曰篤篤亦設而不用與漢人交易鐵器火藥以為捕鹿之具鏢曰武洛刀曰礁傑弓箭曰木拉鍋曰巴六魚網曰下來瑯嶠待客歌立孫呵網直爾來瑯嶠六呷呵談眉談眉此處不似内地那鬼呵網直務昌哩呵朗耶爾來無佳物供應嗎疎嗎疎得罪得罪瑯嶠各社俱受小麻利畨長約束代種薯芋生薑為應差小麻利即瑯嶠一帶主畨也畨長及畨頭目男女以長承襲所需米珠烏青布鐵鐺漢人每以此易其鹿脯鹿筋鹿皮卓戈紋路多險阻沿海跳石而行經傀儡山非數十人偕行未敢輕踐其境瑯嶠諸社隙地民向多種植田畆今有司禁止悉為荒田沿海如魚房港大繡房一帶小船仍往來不絶或云十八社外尚有高士港社是人傑社佳諸來社懷裏社咬人土社滑事滑社附載卑蘭覔係畨社總名在傀儡山後沿海一帶地與傀儡山相連中有高山聳起相傳七十二社與前異各社名不能盡記贌社貿易每在山脚沿海處所約行程四五日始窮其境自卑蘭覔而北有老郎社美基社八里捫社農仔農社一名南仔郎須嘮宰社獨馬煙社株栗社貓武骨社佳嘮突社貓蠻社白逸民社佳落社甕䌇社離北路崇爻社地界百有餘里人煙斷絶自卑蘭覔而南有呂家莽社謝馬子社知本社朝貓離社咬𠺕蘭社寜巒社謝已寜社幹仔弼社幹仔崘社殻只社打早高社大烏萬社離瑯嶠地界六七十里亦鮮人蹟貨則鹿脯鹿筋鹿皮麞皮鹿皮苧藤果則蕉實鳳棃蔗檨柑柚檳榔毛柿土畨日食薯芋黍秫金𤓰鹽自曝用鹿豕魚酒則上珍矣服飾富者烏布為衣嗶吱為抄陰為方􅥶如平埔熟畨之制衣著更短貧者以鹿皮苧衣蔽體耕作無牛亦無銚鎒僅用一鋤闊三寸柄長一尺屈足伏地而鋤捕鹿用獵犬弓矢鏢刀網羅婚嫁男女十餘嵗時男以鏢為定迄成婚畧無聘禮反目男女各擇配偶方離産兒用冷水浴雙胎為不吉委道傍即徙居父母亡視若路人惟為兄弟姊妹服亦僅除草珠而已赴社水路僅容杉板船懸崖石壁無可泊處農仔農社有坑溝一道船至土畨羣立岸上船梢抛索土畨接索挽進即泊溝内若無接挽溝外無可泊處大龜文謝必益諸社俱有路可通或云自糞基湖入傀儡山行二日可至鳥道盤旋䟦履非易外此則穿荆度莽越嶺攀藤尤難施步矣㧞貢施世榜説紅頭嶼畨在南路山後由沙馬磯放洋東行二更至雞心嶼又二更至紅頭嶼小山孤立海中山内四圍平曠傍岸皆礁大船不能泊每用小艇以渡山無草木畨以石為屋卑隘不堪起立産金畨無鐵以金為鏢鏃槍舌昔年臺人利其金私與貿易因言語不諳臺人殺畨奪金後復邀瑯嶠畨同往紅頭嶼畨盡殺之今則無人敢至其地矣或云瑯嶠山後行一日至貓丹又二日過丹哩溪口至老佛又一日至大烏萬社又三日過加仔難社朝貓籬社至卑南覔社畨長名文吉轄達里武甲等七十二社嵗輸正供銀六十八兩零南仔郎港可以泊船由卑南覔一日至八里捫又一日至加老突文吉所屬畨界止此至打水安一日又二日至芝母蘭共五社又行五日至直加宣社俱係北路山後生畨叧詳本社之下凡此山後綿亘聲息鮮通野畨種類無可查據姑附識於此臺海使槎録卷七
