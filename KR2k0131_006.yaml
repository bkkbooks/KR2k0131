body:
  text: 臺海使槎録卷六常鎮揚通道黄叔璥撰北路諸羅畨七阿里山五社踏枋産鹿堵仔唣羅婆盧麻干務竒冷岸大龜佛水沙連思麻丹木武郡赤嘴一名刺嘴箍麻咄目靠挽麟倒咯狎裏蟬巒蠻干那霧居處築室曰濃密架木為樑鑿鬆石片為牆鬆石内山所出鑿之成片上以石片代瓦亦用以鋪地遠望如生成石室比屋相連如同内地街衢與外社迥殊男女未婚嫁叧起小屋曰籠仔曰公廨女住籠仔男住公廨飲食内山多麥豆少米穀芋薯則掘地為穴積薪然火置芋灰中仍覆以土饑則出而食之黍米為酒曰老勿釀製會飲與别社同魚為醢俟有臭味乃食凡物生食居多惟鹽取給於外衣飾衣用鹿皮樹皮横聯於身無袖間有著布衫者捕鹿時以鹿皮搭身皮帽皮鞋馳逐荆棘中畨婦衣自織達戈紋又名府律式掛青紅南把珠於項亦漢人所製收粟時則通社歡飲歌唱曰做田擕手環跳進退低昻唯意所適婚嫁婚姻曰閔言未娶曰胡仔轄亦曰麻達未嫁曰麻里氏氷不待父母媒妁以嘴琴挑之相從遂擁衆挾女以去勢同攘敓後乃以刀斧釜鐺之屬為聘女家以雞豕達戈紋酬之通社羣聚歡飲與外社男贅女家不同夫婦離異女將原聘歸還聽其他適水沙連北港女将嫁時兩頤用針刺如網巾紋名刺嘴箍不刺則男不娶䘮葬凡遇父母兄弟夫婦之䘮頭裹皂布號哭十日不言不笑不履門外𦵏用石板四片築四方穴屈曲屍膝坐埋於中上蓋以石板覆以土器用耕種用小鋤短刀掘地而種行則貨物貯皮囊戴於頭上炊用木扣以代鐺附載水沙連雖在山中實輸貢賦其地四面高山中為大湖湖中復起一山畨人聚居山上非舟莫即畨社形勝無出其右自柴里社轉小徑過斗六門崎嶇而入阻大溪三重水深險無橋梁老藤横跨溪上往來從藤上行外人至輙股慄不敢前畨人慣行不怖也其畨善織罽毯染五色狗毛雜樹皮為之陸離如錯錦質亦細宻四方人多欲購之常不可得畨婦亦白晳妍好能勤稼穡人皆饒裕畨境補逸阿里山離縣治十里許山廣而深峻畨剽悍諸羅山哆咯嘓諸畨皆畏之遇輒引避崇爻社餉附阿里山然地最遠越蛤仔難以南有猴猴社云一二日便至其地多生畨漢人不敢入各社夏秋划蟒甲獨木舟名載鹿脯通草水藤諸物順流出近社與漢人互市漢人亦用蟒甲載貨以入灘流迅急船多覆溺破碎雖利可倍蓰必通事熟於地理乃敢孤注一擲水沙連四週大山山外溪流包絡自山口入為潭廣可七八里曲屈如環圍二十餘里水深多魚中突一嶼畨繞嶼以居空其頂頂為屋則社有火災岸草蔓延繞岸架竹木浮水上藉草承土以種稻謂之浮田隔岸欲詣社者必舉火為號社畨划蟒甲以渡嶼中圓淨開爽青嶂白波雲水飛動海外别一洞天諸羅志阿里山乃總社名内有大龜山之大龜佛社霧山之干仔霧社羅婆山之唣囉婆社束髻山之沙米箕社八童關山之鹿堵社溜藤山之阿㧞泉社朝天山之踏枋社豬母勞社一作肚武膋共八社納餉者五社盧麻産社今無畨皆民居康熙五十六年瘴癘死亡甚衆遂徙居於阿㧞泉社附阿里山合徴者又崇爻山後九社崇爻社竹脚宣社一作即加宣描丹社薄薄社芝舞蘭社多難社一作倒咯滿芝宻社水輦社筠椰椰社或云八社之外又有礁那女嗎社打馬郎社嗎老因籠社巴只力社龜窑社伊碎擺社有至崇爻社者自倒咯嘓用土畨指引盤山逾嶺涉澗穿林計程五日夜方至由民仔里武三日可至蛤仔難但峻嶺深林生畨錯處漢人鮮至或云水沙連過湖半日至加老望埔一日至描里眉一日至眉加堞一日至望加臘一日至福骨一日半至買槽無老又一日半至民仔里武二日至蛤仔難社由描里眉二日至斗截半日至倒哈嘓過大山數重四日夜可抵崇爻社路極崎嶇坑塹險阻難於䟦涉若隂雨水漲更難計程由淡水從山後行路稍平易水沙連社地處大湖之中山上結廬而居山下耕鑿而食湖水縈帶土畨駕蟒甲以通往來環湖皆山層巒險阻屬畨二十餘社各依山築居山谷巉巖路徑崎嶇惟南北兩澗沿岸堪往來外通斗六門竹脚寮乃各社總路隘口通事築室以居焉水沙連集集决里毛碎巒蠻木靠木武郡又子黑社佛子希社亦木武郡轄挽鱗倒咯大基描丹蛤里爛等社名為南港加老望埔描里眉斗截平了萬致務倒咯嘓眉加碟望加臘福骨描里八描里旺買槽無老等社名為北港或云北港尚有買薛買唐於老二社南港之畨居近漢人尚知有法而北港之畨與悠武乃等社野畨接壤最為兇頑巴老完問仔眉觸甲描禇江四社昔屬水沙連統轄今移於巴老完合夥同居與民仔里武俱通於悠武乃生畨矣通事叧築寮於加老望埔撥社丁置煙布糖鹽諸物以濟土畨之用售其鹿肉皮筋等項以資課餉每年五月弔社七月進社共計十個月可以交易完課過此則雨多草茂畨無至者康熙六十年阿里山水沙連各社乗亂殺通事以叛六十一年邑令孫魯多方招徠示以兵威火礟賞以煙布銀牌十二月阿里山各社土官母落等水沙連南港土官阿籠等就撫雍正元年正月水沙連北港土官麻思來等亦就撫惠安太學黄吳祚題水沙連圖詩二十平聲餘社盡邊湖南北沿崖仄徑紆斗六門來通一線諸畨形勝島中無五色尨毛雜樹皮織成罽毯世稀竒蠻孃姸好珠垂項不見做田歌舞時余咏水沙連社三首水沙連在萬山中一嶼環湖映碧空員頂淨明傍作屋渡頭煙火小舟通土乘水上作浮田竹木交加草蔓延最是此間勤稼穡能同輸賦足豐年湖中員嶼外重溪三跨横藤人自迷此境若非畨社異武陵洞口認花蹊北路諸羅畨八大肚牛罵沙轆貓霧拺一名麻務拺岸裏阿里史樸仔離掃拺烏牛難居處大肚諸社屋以木為樑編竹為墻狀如覆舟體制與各社相似貓霧拺諸社鑿山為壁壁前用木為屏覆以茅草零星錯落高不盈丈門戸出入俯首而行屋式迥不同外社飲食酒飯各二種飯不拘秔糯炊而食之或将糯米蒸熟舂為餅餌名都都酒用黍米浸水越宿舂碎和以草麯三五日發氣水浸飲之一将糯米炊飯拌麯置桶中逾三日澄汁蒸酒畨極珍之魚蝦麞鹿與南北投等社無異惟沙轆牛罵不食牛牛死委於道旁衣飾男婦頭貫骨簪曰打拉所掛之珠曰立項帶瑪瑙珠曰牙堵螺牌曰夏力什素衣服不論皂白俱短至臍與各社同嫁娶俱著紅衣貓霧拺岸裏以下諸社俱衣鹿皮并以皮冒其頭面止露兩目婚嫁婚姻曰三問男女先私通投契男以銀錫約指贈女為定曰貓六女倩媒告之父母因為主配或娶或贅届期㑹衆設牲醪相慶不諧即離婦不俟夫再娶先嫁罰酒一瓮私通被獲鳴通事土官罰牛一未嫁娶者勿論岸裏各社完婚三五日男往女家女往男家各以酒物相餽不則絶往來䘮塟畨死䘮塟及浴身入室與南北投等社同守服十二日不出户親戚送飯十二日後請畨神姐祈禳除服婦服滿任自擇配父母兄弟不過問岸裏五社䘮塟與水沙連阿里史同器用收貯禾黍編竹為筐大小不一式出作則置飯於中無升斗以篾籃較凖與漢人交易近亦置牀榻鼎鐺椀筯以為雅觀附畨歌大肚社祀祖歌􅤍仔􅤍麻隱喡什今日過年靡呵麻仔武嘮馬礁乞咿珊都備新酒賽戲祭祖思引咿珊牟起林想祖上何等英雄夜嘮務力咿珊牟起林願子孫一如祖上英雄牛罵沙轆思歸歌嚅嗎嗄乞武力往山中捕鹿蘇多喃任喡須岐散文忽想起兒子並我妻買捷嚅離嗎嗄乞武力速還家再來捕鹿葛買蘇散文喃任岐引吱免得妻子在家盼望貓霧拺社男婦會飲應答歌爾貓呻嗼幼畨請畨婦先歌爾達惹巫腦畨婦請幼畨先歌爾貓力邁邁由系引呂乞麻畨曰汝婦人賢而且美爾達惹麻達馬鱗唭什格婦曰汝男人英雄兼能捷走爾貓力邁邁符馬乞打老末轆引奴薩畨曰汝婦人在家能養雞豕并能釀酒爾達惹達赫赫麻吮倒叮文南乞網果嗎婦曰汝男人上山能捕鹿又能耕田園美什果孩㖿彎哩勺根嗼巫腦岐引奴薩今衆社皆大歡喜和歌飲酒附載過沙轆至牛罵社社屋隘甚假畨室牖外設榻縁梯而登雖無門闌喜其高潔余榻面山霾霧障之凡五日苦不得一覩其麓忽見開朗殊快不知山後深山當作何狀將豋麓望之社人謂野畨常伏林中射鹿見人則矢鏃立至慎毋往予䇿杖披荆拂草而登既陟顛荆榛樛結不可置足林木如蝟毛聫枝累葉隂翳晝暝仰視太虗如井底窺天時見一規而已雖前山近在目前而宻樹障之都不得見惟有野猿跳躑上下向人作聲若老人咳又有老猿若五尺童子箕踞怒視風度林杪作􅉡􅉡聲肌骨欲寒瀑流潺潺尋之不得而修蛇乃出踝下心怖遂返越日大雨嵐氣甚盛衣潤如洗堦前泥濘足不得展徘徊悵結賦詩曰畨舍如蟻垤茅簷壓路低嵐風侵短牖海霧襲重綈避雨從留屐支牀更著梯前溪新漲阻徙倚欲雞栖頃之有畨婦至墳首瘠體貌不類人舉手指畫若有所欲余探得食物與之社人望見亟麾之去曰此婦有術善祟人毋令得近也稗海紀遊岸裏内幽礁吧年茅匏阿里史諸社磴道峻折溪澗深阻畨矬健嗜殺雖内附罕與諸畨接種山射生以食縫韋作幘鹿皮作衣臍下結以方布聊蔽前體露臂跣足茹毛飲血登山如飛深林邃谷能蛇鑽以入舉物皆以負戴居家則裸惟不去方布周身頑癬斑駁腥臊特甚畨女亦自白晳繞唇吻皆刺之㸃細細黛起若塑羅漢髭頭共相稱美樸仔籬烏牛難等社有異種狗狀類西洋不大而色白毛細軟如綿長二三寸畨㧞其毛染以茜草合而成線雜織領袖衣帶間相間成文朱敫奪目數社之犬惟存其鞹諸羅志岸裏樸仔離阿里史掃拺烏牛欄五社不出外山惟向貓霧拺交易樸仔離逼近内山生畨眉裏嘓貓堵貓堵兩社間出殺人過半線往大肚則東北行矣大肚山形遠望如百雉高城昔有畨長名大眉志謂每嵗東作衆畨爭致大眉射獵於箭所及地禾稼大熟鹿豕無敢損折者箭所不及輙被蹂躪不亦枯死其子斗肉女阿巴里壻大柳望各社仍然敬禮獲鹿必先貽之沙轆畨原有數百人為最盛後為劉國軒殺戮殆盡只餘六人潛匿海口今生齒又百餘人辛丑七月大風糯黍歉收間為别番傭工以餬口土官嘠即目雙瞽能約束衆畨指揮口授無敢違社南地盡膏腴可種水田漢人有欲售其地者嘠即佯許之私謂衆畨曰祖公所遺祗此尺寸土可耕可捕藉以給饔飱輸餉課今售於漢人侵佔欺㺯勢必盡為所有闔社将無以自存矣我與某素相識拒其請将搆怨衆為力阻無傷也卒不如其請余北廵至沙轆嘠即率各土官婦跪獻都都畨婦及貓女為戲衣錦紵簪野花一老嫗鳴金以為進退之節聚薪然火光可燭天畨婦拱立各給酒三大椀一吸而盡朱顔酡者絶鮮挽手合圍歌唱跳舞繼復逐隊蹋地先作退步後則踴躍直前齊聲歌呼惟聞得得之聲次早將還郡治土官遠送婦女咸跪道旁俯首高唱如誦佛聲詢之通事則云祝願步步得好處一社攀送有戀戀意抵郡後聞將社名喚作廻馬社以余與吳侍御北廵至此廻也余因漫紀六首沙轆行來近北邊裸人雖陋意殊䖍官厨未識都都味首頂糍盤衆婦先聚薪然火燭天衢一嫗鳴金貓女趨三椀鯨吞齊賜酒合圍挽手共歌呼踏地分曹却退行團花簇錦鬬身輕直前逞態蹁躚甚高唱惟聞得得聲自聞天使過臺時畨社遙臨豈所期内視土官能漢語劇憐耄孺盡歡嬉臨發追攀不憚勞行行為爾駐旌旄蠻孃伏地齊聲唱一步爭如一步高誰言異類不同羣煦嫗春温未忍分見說新名迴馬社他年留紀海東雲北路諸羅畨九崩山八社大甲東社日貓盂大甲西社寮宛里霄南房裏雙吞後壠新港仔貓裏加至閣中港仔以上四社俱附後壠納餉竹塹礁磱巴居處營屋先䜿木為牆用草結蓋體制與别社同稍卑隘合家一室惟娶婦贅壻則叧室而居飲食畨地少播秔稻多種黍芝麻飯皆黍米又蒸熟置罌缶中俟發變曬乾舂為麯拌黍飯藏於瓮數日後試其味則投以水蒸其液為酒魚蝦醃為鮭鹿麂醃為脯餘物皆生食衣飾各社畨皆束髪未娶者或分梳兩髻於額角惟此數社則剪髪至額戴竹節帽竹取其裏白反而為之高寸許以紅絲帶纒繞又以烏絲線縛之以白螺殻為方塊可寸許名曰哈達圍於項或用螺殻間用瑪瑙珠串束於手以善走為雄麻達編五色篾束腹至胸以便奔走穿耳實以竹圏圏漸舒則耳漸大垂至肩乃實以木板或嵌以螺錢娶婦則去其束箍摘其耳實衣名几轆長至腰以布及達戈紋為之下體圍布二幅亦名遮隂間有衣鹿皮者會飲土官多用優人蟒衣皂靴漢人絨帽畨婦衣几轆圍遮隂耳穿五孔飾以米珠名鶴老卜頸掛瑪瑙珠名璽忽因耶那數十人連手頓足歌唱為樂婚嫁嫁娶曰諳貓麻哈呢娶婦先以海蛤數升為聘竹塹間用生鹿肉為定蛤大如拇指殻有青文生海邊石壁間盡力採取日不過數升甚珍之及嫁娶時用海蛤一搭紀搭紀用竹篾編成大口小腰高尺餘可容數斗殺牛飲酒歡會竟日父母娶婦或一二年三五年分居視其婦孝與否耳無一世同居者一女則贅壻一男則娶婦男多則聽人招贅惟幼男則娶婦終養女多者聽人聘娶惟幼女則贅壻為嗣夫婦服必逾年而後嫁娶不和或因姦則離夫未娶婦不敢先嫁嫁則罰婦及後夫并婦之父母各瑪瑙珠一串或牛一隻以歸後夫不受罰則糾集親衆負弓矢持鏢刀至後夫之家拆毁房屋倉囷土官通事不能禁私通亦然强者將其婦及姦夫立殺死或與麻達通祗罰婦酒一甕麻達不問女與麻達通亦不問䘮塟畨死男女老幼皆裸體用鹿皮包裹親屬四人舁至山上用鹿皮展鋪如席將平生衣服覆身用土掩埋服尚白色既塟本家及舁䘮人三日不出戸不舂不歌畨親供給飯食一月後赴園耕種通社亦三日不赴園以社有不吉事也居䘮父母兄弟半月夫婦一月一月後婦不帶耳珠著豔服改適方如常器用耕種犂耙諸器均如漢人食器亦有鐵鐺甆椀阿里山水沙連内山諸畨尚用木扣平埔諸社多倣漢人附畨歌崩山八社情歌沈㖿嘮葉嗼賔呀離乃嘮夜間聽歌聲末力㕭弋達些我獨卧心悶末里流希馬砌獨夏噫嗄喃又聽鳥聲鳴想是舊人來訪達各犂目歇馬交嗄斗哩走起去看却是風吹竹聲嗼下遙寜臨律嗼噃噫嗄喃呀㣲總是懐人心切故爾後壠社思子歌曳底高毛白怪鳥飛去㕭目㕭甘宰老描崙飛倦了宿在樹上末力希吕㕭見景心悶毛嗄㕭嗼幽耶林嘮想起我兒子目歇㕭越耶回家去看仔者麽飲呂㕭請諸親飲酒釋悶竹塹社土官勸畨歌旺奇冉乞别焉毛嗒耶呼社長請爾等來飲酒打阿保留貓轆弋奇老久焉魯我祖公最善捕鹿作田弋探耶林尤耶林真嗎吧搭藍爾少年子孫當聽我教導由擺乞打保貓轆弋傳呵禄允當學我祖勤謹耕捕打呵貓武呼别焉土官就愛惜爾其耶林林毛嗒耶呼還邀來飲酒附載渡溪後過大甲社即崩山雙寮社至宛里社御車畨人貌甚陋胸背雕青為豹文男女悉剪髪覆額作頭陀狀規樹皮為冠番婦穴耳為五孔以海螺文貝嵌入為飾捷走先男子經過畨社求一勺水不可得得見一人輙喜自此以北大概畧同至中港社見門外一牛甚腯囚木籠中俯首跼足體不得展社人謂是野牛初就靮以此馴之又云前路竹塹南嵌山中野牛千百為羣土畨能生致之候其馴用之今郡中輓車牛强半皆是自竹塹迄南嵌八九十里不見一人一屋求一樹就隂不得途中遇麋鹿麏麚逐隊行甚夥既至南嵌入深箐中披荆度莽冠履俱敗直狐貉之窟非人類所宜至也稗海紀逰康熙壬戌偽鄭守雞籠凡需軍餉值北風盛發船不得運悉差土畨接遞男女老穉背負供役加以督運弁目酷施鞭撻相率作亂殺諸社商往來人役新港仔竹塹等社皆附焉鄭克􅡕令左協陳絳率兵擒𠞰土著盡遁入山叢林疊澗無從捕緝仍不時出没剽掠議就要道䜿柵防守困之海上事畧南日山後有巨石峭削巍峩出内山之頂或名為冠石後壠諸社指石為的登絶頂東洋及山後諸社可一望而盡諸羅志崩山畨皆留半髪傳說明時林道乾在彭湖往來海濱見土畨則削去半髪以為碇繩畨畏之每先自削以草縛其餘崩山八社所屬地横亘二百餘里髙阜居多低下處少畨民擇沃土可耕者種芝麻黍芋餘為鹿場或任抛荒不容漢人耕種竹塹後壠交界隙地中有水道業戸請墾無幾餘皆依然草萊故往年自大甲溪而上非縣令給照不容出境大甲西社離港十里雙寮社離港六里後壠社離港三里竹塹社離港十里南嵌社離港二十里淡水社則直臨大海各有通事往來郡治貨物自南而北者如鹽如糖如煙如布疋衣線自北而南者如鹿脯鹿筋鹿角鹿皮芝麻水藤紫菜通草之類近竹塹為汝緑生畨名猴社叅將阮蔡文咏大甲婦詩大甲婦一何苦為夫饁餉為夫鋤為夫日日績麻縷績縷須淨亦須長撚匀合線𦂳雙股斵木虗中三尺圍鑿開一道兩頭堵輕圓漫捲不支機一任𤣥黄雜成組間彩頗似虹霓生綻花疑落仙姬舞吾聞利用前民有聖人一器一名皆上古况兹杼軸事機絲制度周詳供黻黼土畨蠢爾本無知制器伊誰遠近取日計苦無多月計有餘褸但得稍間餘軋軋事傴僂畨丁横肩勝綺羅畨婦周身短布裋大甲婦一何苦後壠詩去縣日以遠風俗日以變顧此後壠畨北至中港限音語止一方他處不能辨頭髪頂上垂當額前後剪髪厚壓光頭其形類覆盌亦有一二人公然戴高冕黑絲及紅絨纒之千百轉大有古人風所惜雙足跣男女八九嵗牙前兩齒剗長大手自牽叧居無拘管父固免肯堂翁亦無甥館是處兩三間邨莊何蕭散高廪置平原黍稷有餘輓所慮濕氣蒸駕木如連棧巨匏老而堅行汲絡藤辮溪水漲連旬利涉身焉綰豐年百禮偕疾病顛危罕飲酒即高歌其樂何衎衎竹塹詩南嵌之畨附淡水中港之畨歸後壠竹塹周環三十里封疆不大介其中聲音畧與後壠異土風習俗將無同年年捕鹿邱陵比今年得鹿實無幾鹿場半被流民開蓺麻之餘兼蓺黍畨丁自昔亦躬耕鐵鋤掘土僅寸許百鋤不及一犂深那得盈寜畜妻子鹿革為衣不貼身尺布為裳露雙髀是處差徭各有幇竹塹煢煢一社耳鵲巢忽爾為鳩居鵲盡無巢鳩焉徙阮庚午舉人北路諸羅畨十南嵌坑仔霄里龜崙以上三社附南嵌納餉淡水内北投麻少翁武嘮俗作朥非灣大浪泵擺接鷄柔以上六社附淡水納餉大雞籠山朝金包裏以上二社附鷄籠納餉蛤仔難哆囉滿俗作非附蛤仔難納餉八里分外北投大屯里末峯仔嶼雷裏八芝連大加臘木喜巴壠奇武卒秀朗里族答答悠麻一作毛里即吼奇里岸眩眩小雞籠居處淡水地潮濕畨人作室結草搆成為梯以入鋪木板於地亦用木板為屋如覆舟極狹隘不似近府縣各社寛廣前後門戸式相類飲食畨多不事耕作米粟甚少日三飱俱薯芋餘則捕魚蝦鹿鹿採紫菜通草水藤交易為日用且輸餉亦用黍米嚼碎為酒如他社志謂淡水各社不藝圃無葱韮生菜之屬雞最繁客至殺以代蔬俗尚冬瓜官長至抱瓜以獻佐以粉餈鷄則以犒從者鳥獸之肉傅諸火帶血而食麋鹿刺其喉吮生血至盡乃剝割腹草將化者緑如苔置鹽少許即食之衣飾畨婦頭無粧飾烏布五尺蒙頭曰老鍋頂上掛瑪瑙珠螺錢草珠曰真仔贊耳鑽八九孔帶漢人耳環每至力田之候男女更新衣曰換年會衆飲酒以示更新婚嫁既娶曰麻民未娶曰安轆自幼倩媒以珠粒為定及長而娶間有贅於婦家者届期約諸親宰割牛豕以黍為粿狀如嬰兒取叶兆熊羆之意夫婦相聚白首不易婦與人私則將姦夫父母房屋拆毁倍罰珠粒分社畨以示教家不嚴未嫁娶者不禁䘮塟畨亡用枋為棺瘞於厝邊以常時什物懸墓前三日外闔家澡身除服又與别社期年三月十日者不同器用無田器耕以鋤平時所佩鏢刀弓箭之屬厝内所用木扣螺椀之類附畨歌淡水各社祭祀歌晩日居留什䖍請祖公晩眉䖍請祖母街乃宻乃濃爾來請爾酒街乃宻乃司買單悶爾來請爾飯共菜打梢打梢樸薩嚕塞嗼庇祐年年好禾稼樸薩嚕朱馬喈嚼喈自東自西好收成麻查吱斯麻老麻薩拉捕鹿亦速擒獲附載雞籠淡水夷在泉州彭湖嶼東北名北港又名東畨永樂中鄭和入海諭諸酋畨獨不聼約束和貽之家一銅鈴使頸之蓋狗之也雜記自南嵌越小嶺在海岸間行巨浪捲雪拍轅下衣袂為濕至八里分社有江水為阻即淡水也水廣五六里港口中流有雞心礁海舶畏之乗蟒甲由淡水港入前望兩山夾峙曰干豆門水道甚隘入門水忽廣漶為大湖渺無涯涘行十許里高山四繞周廣百餘里中為平原惟一溪流水麻少翁等三社縁溪而居甲戍四月地動不休畨人怖恐相率徙去俄陷為巨浸距今不三年再指淺處猶有竹樹梢出水面三社舊址可識麻少翁内北投在磺山左右毒氣蒸鬱觸鼻昏悶諸畨常以糖水洗眼隔干豆門巨港依山阻海划蟒甲以入地險固數以睚眦殺漢人官軍至則竄淡水以北諸畨此最難治武嘮灣大浪泵等䖏地廣土沃可容萬夫之耕八里分社舊在淡水港西南之長豆溪荷蘭時後壠最悍殱之幾無遺種乃移社港之東北淡水各社土官有正副頭目之分稗海紀遊哆囉滿産金淘沙出之與瓜子金相似畨人鎔成條藏巨甓中客至每開甓自炫然不知所用近嵗始有擕至雞籠淡水易布者斗尾龍岸畨皆偉岸多力文身文面狀類魔鬼出則焚掠殺人土畨聞其出皆號哭走避鄭經統兵往𠞰深入不見一人時亭午酷暑軍士皆渴競取甘蔗啖之劉國軒守半線率數百人至見經大呼曰何為至此令三軍速刈草為營亂動者斬言未畢四面火發文面五六百人奮勇挑戰互有殺傷餘皆竄匿深山竟不能滅僅燬其巢而歸阿蘭畨近斗尾龍岸狀貌亦相似雞距畨足趾楂如雞距性善縁木樹上往來跳躑捷同猴狖食息皆在樹間非種植不下平地其巢與雞籠山相近常深夜獨出至海濱取水遇土畨往往竊其首去土畨亦追殺不遺餘力蓋其足趾楂不利平地多為土畨追及既登樹則穿林度棘不可復制矣畨境補逸雞籠山土著種類繁多秉質驍勇概居山谷按其山川則形勝奇秀論其土地則千里饒沃溪澗深遠足以設立州縣惟少人工居址荒蕪未闢皆為鳥獸蛇龍之窟惜哉偽鄭時上淡水通事李滄愿取金自效希受一職偽監紀陳福偕行到淡水率宣毅鎮兵并附近土著未至卑南覔社土畨伏莽以待曰吾儕以此為活唐人來取必决死戰福不敢進回至半途遇彼地土畨泛舟别販福率兵攻之獲金二百餘并繫其魁令引路刀鋸臨之終不從按出金乃臺灣山後其地土畨皆傀儡種類未入聲教人蹟罕到自上淡水乗蟒甲從西徂東返而自北而南溯溪而進匝月方到其出金之水流從山後之東海與此溪無與其地山枯水冷巉巖峻峭洩水下溪直至返流之處住有金沙土畨善泅者從水底取之如小豆粒巨細藏之竹簏或袐之瓿甊間出交易彼地人雖能到不服水土生還者無幾海上事畧龜崙霄裏坑仔諸畨體盡矲􆀒趨走促數又多斑癬狀如生畨康熙壬寅五月十六至十八三日大風漳州把總朱文炳帶卒更戍船在鹿耳門外為風飄至南路山後厯三晝夜至蛤仔難船破登岸畨疑為冦將殺之社有何姓者素與畨交易力為諭止晩宿畨社畨食以彘朱以片臠餉畨輙避匿不食借用木罌瓦釡畨惡其汚也洗滌數四所食者生蠏烏魚畧加以鹽活嚼生吞相對驩甚文炳臨行犒以銀錢不受與以藍布舊衣欣喜過望兼具蟒甲以送蟒甲獨木挖空兩邊翼以木板用藤縛之無油灰可艌木易流入畨以杓不時挹之行一日至山朝次日至大雞籠又一日至金包裏蛤仔難有金井水極寒畨淘金先置火及酒於井旁懸藤綆入取井底泥沙口含手掬急挽而上寒不可支飲酒向火良久乃如常有得一二錢者有數分者亦有一無所得者既非兼金且散碎難鎔冒死求利畨人每苦為之或云後山倒咯滿南有金沙溪金沙從内山流出近溪畨婦淘沙得金後為蛤仔難畨所據蛤仔難三十六社礁轆軒社宇馬氏社期班女懶社八知美簡社一作巴抵女簡嘮㧞丹社基宻丹社八知買驛社一作巴抵馬悦礁仔壠岸社一作礁礁人岸麻里陳轆社一作貓里藤角辛也罕社一作新仔羅罕其㳫㳫社須老員社一作思老完八陳雷社奇武煖社抵宻宻社一作芝宻倒麥倒麥社礁嘮貓社巴老鬱社賓耶知懶社脾釐社奇直扳社賓仔貓力尾社沈美閣社歪阿歪阿社一作歪仔歪陳雷女簡社削骨削骨社礁嘮宻社巴嘮辛仔員社一作巴老臣那浮毒龜晩社一作搭龜滿奇武流社佳笠苑社一作交里苑冬仔爛社一作徵也難懶其餘四社一作肉生打鄰里劉簡了喏一作期尾笠毋罕毋罕貓嘮府偃汚泥肴未知孰是陳湄川中丞淡水各社紀程淡水港水路十五里至千豆門南港水路四十里至武嘮灣此地可泊船内雞心礁陸路六里至雷裏六里至了阿八里至秀朗三十里至里末三里至擺接北港水路十里至内北投四里至麻少翁十五里至大浪泵此地可泊船三里至奇武仔十五里至答答悠五里至里族六里至麻里即吼二十里至峯仔嶼上灘水路七十里至嶺脚上嶺下嶺十里渡海十二里至雞籠又淡水港北過港坐蟒甲上岸至八里分十五里至外北投十二里至雞柔山十五里至大屯三十里至小雞籠七十里至金包裏跳石過嶺八十里至雞籠社畨人逐鹿曾至磺山絶頂有水如池澄然一泓臺海使槎録卷六
