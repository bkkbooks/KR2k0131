body:
  text: 臺海使槎錄卷八常鎮揚通道黄叔璥撰生畨諸羅鳯山畨有土畨野畨之别野畨在深山中疊嶂如屏連峯插漢深林宻箐仰不見天棘刺藤蘿舉足觸礙葢自洪荒以來斧斤所未入野畨巢居穴處血飲毛茹種類實繁其升高陟巔越箐度莽之㨗可以追驚猿逐駭獸平地諸畨恒畏之無敢入其境客冬有賴科者欲通山東土畨與七人為侣晝伏夜行從野畨中越度萬山竟達東面東畨導遊各社禾黍芃芃比戸殷富謂苦野畨間阻不得與山西通欲約西畨夾擊之又曰寄語長官若能以兵相助則山東萬人鑿山通道東西一家共輸貢賦為天朝民矣有當事者能持其議與東畨約期夾擊𠞰撫並施烈澤焚山夷其險阻則數年後未必不變荆棘為坦途而化槃瓠僰筰為良民也稗海紀遊諸羅山以上皆在深溪峻嶺之間惟知採捕麞鹿聽商貿易鮮食衣毛所異於禽獸者幾希矣畨之性雖剛而狠但見小而善疑故無非分之求其技善奔走穿藤攀棘㨗於猿猱所用之器鏢鎗最利竹弓竹箭雖不甚競而射飛逐走發無不中倘使稍有知識偶或蠢動亦非易制之衆也諸羅雜識臺灣生畨素喜為亂茍有不足則出山屠殺商民然撫此類也若專以威則難搗其穴或柔以惠則難飽其貪要當示之以威武懷之以德意駕馭有術不敢背叛且各社自樹其黨不相統轄力分則薄較易繩束又其俗尚殺人以為武勇所屠人頭挖去皮肉煑去脂膏塗以金色藏諸高閣以多較勝稱為豪俠云海上事畧熟畨平地近畨不識不知無求無欲日遊於葛天無懷之世有擊壤鼓腹之遺風往來市中狀貌無甚異惟兩目坳深瞪視似稍别其語多作都盧嘓轆聲呼酒曰打喇酥煙曰篤木固相傳元人滅金金人有浮海避元者為颶風飄至各擇所居耕鑿自贍數世之後忘其所自而語則未嘗改終嵗不知春夏老死不知年嵗有金錢無所用故不知蓄積秋成納稼計終嵗所食有餘則盡付麯蘗無男女皆嗜酒屋必自搆衣必自織績麻為網屈竹為弓以獵以漁罔非自為而用之腰間一刃凡所成造皆出於此惟陶冶不能自為得鐵則取澗中兩石自槌之久亦成器社推一二人為土官非滇廣徴賦税操殺奪擁兵自衛者比稗海紀遊土畨非如雲貴之貓獠猺獞各分種類聚族而居者也社之大者不過一二百丁社之小者止有二三十丁見在各社有正副土官以統攝畨衆然亦文項蒙頭無分體統考其實即内地里長保長之役耳東寜政事集社商紅毛始踞時平地土官悉受約束犯法殺人者𠞰滅無孑遺鄭氏繼至立法尤嚴誅夷不遺赤子併田疇廬舍廢之諸畨謂鄭氏來紅毛畏逃今鄭氏又𠞰滅帝真天威矣故其人既愚又甚畏法郡縣有財力者認辦社課名曰社商社商又委通事夥長輩使居社中凡畨一粒一毫皆有籍稽之射得麋鹿盡取其肉為脯并取其皮二者輸賦有餘然朘削無厭視所有不異已物平時事無巨細悉呼男婦孩穉供役且納畨婦為妻妾有求必與有過必撻而畨人不甚怨之茍能化以禮義風以詩書教以蓄有備無之道制以衣服飲食冠婚䘮祭之禮遠在百年近則三十年將見風俗改觀率循禮教寜與中國之民有異乎余謂欲化畨人必如唐韋臯宋張詠之治蜀久任數十年不責旦暮之效然後可噫葢亦難言矣然又有暗阻潛撓於中者則社棍是也謀長夥長通事熟識畨情復解畨語父死子繼流毒無已社商有虧折耗費此輩坐享其利社商率一二嵗更易此輩雖死不移利畨人之愚又欲畨人之貧愚則攫奪惟意貧則力不敢抗即有以寃訴者畨語侏離不能達情通事顛倒以對畨人反受呵譴是舉世所當哀矜者莫畨若矣乃以其異類且歧視之見其無衣曰是不知寒見其雨行露宿曰彼不致疾見其負重馳遠曰若本耐勞噫若亦人也馬不宿馳牛無偏駕否則致疾牛馬且然而况於人乎抑知彼茍多帛亦重綈矣寒胡為哉彼茍無事亦安居矣暴露胡為哉彼茍免力役亦暇且逸矣奔走負戴胡為哉異其人何必異其性稗海紀遊社餉贌社之税在紅夷即有之其法每年五月初二日主計諸官集於公所願贌衆商亦至其地將各社港餉銀之數高呼於上商人願認則報名承應不應者減其數而再呼至有人承應而止隨即取商人姓名及所認餉額書之於册取具街市舖戸保領就商徴收分為四季商人既認之後率其夥伴至社貿易凡畨之所有與畨之所需皆出於商人之手外此無敢買亦無敢賣雖可裕餉實未免於累商也臺灣南北畨社以捕鹿為業贌社之商以貨物與畨民貿易肉則作脯發賣皮則交官折餉日本之人多用皮以為衣服包裹及牆壁之飾嵗必需之紅夷以來即以鹿皮興販有皮有牯皮有母皮有麞皮有末皮皮大而重鄭氏照觔給價其下四種俱按大小分價貴賤一年所得亦無定數偽册所云捕鹿多則皮張多捕鹿少則皮張少蓋以鹿生山谷採捕不能預計也諸羅雜志交納鹿皮自紅毛以來即為成例收皮之數每年不過五萬張或曰萬餘張牯皮母皮末皮麞皮皮分為五等大小兼收偽册報部並未有止用大鹿皮及山馬皮之説東寜政事集畨俗醇樸太古之遺一自居民雜㳫强者欺畨視畨為爼上之肉弱者媚畨導畨為升木之猱地方隱憂莫甚於此社餉一項鳳山下淡水八社畨米在偽鄭原數五千九百三十三石八斗蕩平後酌減為四千六百四十五石三斗諸羅社餉共七千七百八兩零未邀裁減從前猶可支持以地皆畨有出産原多自比年以來流亡日集以有定之疆土處日益之流民累月經年日事侵削向為畨民鹿場麻地今為業戸請墾或為流寓佔耕畨民世守之業竟不能存什一於千百且開臺來每年維正之供七千八百餘金花紅八千餘金官令採買麻石又四千餘金放行社鹽又二千餘金總計一歲所出共二萬餘金中間通事頭家假公濟私何啻數倍土畨膏血有幾雖欲不窮得乎今一切陋弊革盡無餘而正供應作何酌征以蘇畨黎之苦周鍾瑄上滿總制書捕鹿鹿場多荒草高丈餘一望不知其極逐鹿因風所向三面縱火焚燒前留一面各畨負弓矢持鏢槊俟其奔逸圍繞擒殺漢人有私往場中捕鹿者被獲用竹桿將兩手平縛鳴官究治謂為悞餉相識者面或不言暗伏鏢箭以射之若雉兎則不禁也畨役凡長吏將弁遠出畨為肩輿行笥襆被皆其所任疲於奔命久矣曾為嚴止余廵視南北兩路概不令任諸力役惟過淡水虎尾大肚溪深水漲用五六人擎扶筍輿犒以錢煙假宿社寮及兵弁輿從栖止處悉酬以煙布諸畨驩甚謂為從來未有間以所食物予畨則驩然盡飽問何故跣足曰非樂此特無履耳可見人性皆同土官饋獻新官莅任各社土官瞻謁例有饋獻率皆通事書記醵金承辦羊豕鵝鴨惠泉包酒從中侵漁不止加倍余初抵臺時正值農忙兼值溪漲往來僕僕必致廢時失業檄行鳳諸二縣禁止𣲖勒赴府呈送禮物通事輩無可生發亦不慫慂其來也畨界内山生畨野性難馴焚廬殺人視為故常其實啟釁多由漢人如業主管事輩利在開墾不論生畨熟畨越界侵佔不奪不饜復勾引夥黨入山搭寮見畨弋取鹿麂往往竊為已有以故多遭殺戮又或小民深入内山抽藤鋸板為其所害者亦有之康熙六十一年官斯土者議凡逼近生畨處所相去數十里或十餘里􅆆石以限之越入者有禁鳳山八社皆通傀儡生畨放䌇社外之大武力力枋寮口埔薑林六根茄藤社外之糞箕湖東岸莊力力社外之崙仔頂四塊厝加泵社口下淡水社外之舊檳榔林莊新東勢莊上淡水社外之新檳榔林莊柚仔林阿猴社外之揭陽崙柯柯林搭樓社外之大武崙内卓佳莊武洛社外之大澤機溪口俱立石為界自加六堂以上至瑯嶠亦為嚴禁諸羅羅漢門之九荆林淡水溪墘墘或墈字之誤大武壠之南仔仙溪墘茄茇社山後哆囉嘓之九重溪老古崎土地公崎下加冬之大溪頭諸羅山之埔姜林白望埔大武巒埔盧麻產内埔打貓之牛屎坑口葉仔坑口中坑仔口梅仔坑山他里霧之麻園山脚庵古坑口斗六門之小尖山脚外相觸溪口東螺之牛相觸山大里善山大武郡之山前及内莊山半線之投捒溪墘貓霧捒之張鎮莊崩山之南曰山脚吞霄後壠貓裏各山下及合歡路頭竹塹之斗罩山脚淡水之大山頂山前并石頭溪峯仔嶼社口亦俱立石為界由雞籠沿山後山朝社蛤仔難直加宣卑南覔民人耕種樵採所不及往來者鮮矣吞霄淡水之亂康熙己巳二月吞霄通事黄申征𣲖無虚日社畨苦之會畨捕鹿申約先納錢米而後許出土官卓个卓霧亞生等大譟殺申及其夥十餘人參將常泰進𠞰以新港蕭壠麻豆目加溜灣四社畨為前部死傷甚衆復遣岸裏畨繞出吞霄山後夾撃設伏殺之五月淡水土官氷冷率衆射殺主賬金賢及與賢善者盡殺之與个霧等通水師把總失其名誘而執之吞霄去半線百里夾倒旗太平二山之間路通内山有險可恃昔年防汛止於牛罵隔吞霄六十餘里故卓个卓霧等敢於為亂氷冷為官兵圍急全社竄伏山上削竹為籖以溺浸之火炙數次堅黑如鐵遍插於山人不能前後為把總誘執駢斬其首屍遊各社有請乞免游者謂畨頭過社則一社皆瘟後將氷冷梟示淡水海岸諸畨逺望迂道而行并不敢履其境馭畨生畨殺人臺中常事此輩雖有人形全無人理穿林飛箐如鳥獸猿猴撫之不能𠞰之不忍則亦末如之何矣惟有於出没要隘必經之途游巡設伏大張礟火虗示軍威使彼畏懼而不敢出耳然此皆由於地廣人稀不闢不聚之故不盡由侵擾而然蓋生畨所行之處必林木叢茂荆榛蕪穢可以藏身遇田園平埔則縮首而返不敢過其殺人割截首級烹剝去皮肉飾髑髏以金誇耀其衆衆遂推為雄長野性固然設法防閑或可稍為歛戢䆒未有長䇿也然則將何以治之曰以殺止殺以畨和畨征之使畏撫之使順闢其土而聚我民焉害將自息久之生畨化熟又久之為戸口貢賦之區矣東征集臺灣歸化土畨散處村落或數十家為一社或百十家為一社社各有通事聽其指使所居環植竻竹社立一公所名曰公廨有事則集耕歛僅給家食不留餘蓄日事佃獵取麋鹿麞麂為生其俗男女同川而浴未婚娶者夜宿公廨男女答歌相慕悦而後為夫婦㧞去前齒齒皆染黑傳所謂黑齒雕題者乎性好勇尚力所習强弩鐵鏢短刀别無長刃利㦸藤牌鳥鎗之具或與鄰社相惡稱兵率衆羣然鬨鬬然未嘗有步伐止齊之規鬬罷散去或依宻林或伏莽草伺奇零者擒而殺之所得頭顱擕歸社内受衆稱賀漆其頭懸掛室内以數多者稱為雄長要其戰爭長於埋伏掩襲之謀利於巉巖草樹之區便於風雨㝠晦之候若驅之於平坂曠野之地則其技立窮且可以制其死命者有二其地依山並不産鹽斷絶其鹽彼將揺尾求食矣一也春夏之際其地雨多而露濃故一望蓊蘙至隆冬之日則一炬可盡彼將鳥獸散矣二也夫生之殺之其權在於我土畨豈能為吾患乎若利其有而資之以鹽任社商剝尅而不之禁令鑿齒之倫鋌而走險乃復不察地勢審利害茍且動衆而曰土畨能戰也豈不謬哉大凡土畨雖稱殊悍而頗近信倘招之以義撫之以恩明賞罰善駕馭以導之吾見耕者獵者安於社敬事赴公者服於途其風猶可近古也理臺末議社畨不通漢語納餉辦差皆通事為之承理而奸棍以畨為可欺視其所有不異已物藉事開銷朘削無厭呼男婦孩稚供役直如奴𨽻甚至畧賣或納畨女為妻妾以至畨民老而無妻各社戶口日就衰微尤可異者縣官到任有更換通事名色繳費或百兩或數十兩不等設一年數易其官通事亦數易其人此種費用名為通事所出其實仍在社中償補當官既經繳費到社任意攫奪豈復能鈐管約束因與道府約嗣後各社通事俱令於各該縣居住社中有應辦理事件飭令前往給以限期不許久頓畨社以滋擾累盜買盜娶者除斷令離異仍依律治之至通事一役如不法多事即當責革若謹愿無過便可令其常充不得藉新官更換混行𣲖費違者計贓議罪肄業畨童拱立背誦句讀鏗鏘頓革侏離舊習陳觀察大輦有司教之責語以有能讀四子書習一經者復其身給樂舞衣巾以風厲之癸卯夏高太守鐸申送各社讀書畨童余勞以酒食各給四書一册時憲書一帙不惟令奉正朔亦使知有寒暑春秋畨不記年或可漸易也附題詠裸人叢笑篇十四首孫元衡皇威懾海若崩角革頑凶昔從倭鬼役今為王者農酋長加以􅃣族類裸其躬震驚鞭撻威嬉戲刀劍鋒臺郎出守羅星宿云是大唐王與公五十二區山百重南極蜈蜞北鷄籠渾沌不鑿天年終衛鬤縵靡草䰏髽如植竿獨竦兕薦立兩岐羱角端不簪亦不弁雜卉翼以翰謂當祝髪從甌駱爾胡不髠能自完鑿囷貫竹皮括輪象日月兮衛其身圓景雙擔色若銀我聞無腸之東聶耳國趨走捧持猶捧珍又云一耳為衾一為茵非其苗裔强相效嗚呼坎德胡不辰齒耳夫何以皓為又奚取於漬汁而漆頤厲骨辟穢芳其脂墨氏毋寧悲染絲倒懸覆臟如縶羵羊織竹為笟約肚束腸行犇登躍食少力强蜂壺猿臂逐鹿踰岡將刀斷之挽手上堂為語楚宮休餓死盍習此術媚其王短布無長縫尚𤣥戒施縞桶裠本陋制不異蠻犵狫狫蠻鑿齒䘮其親爾蠻鑿齒媾其姻雜俗殊風仁不仁管承鼻息颺簫音筠亞齒隙調琴心女兒别居椰子林雄鳴雌和終凡禽不顧耶孃囘面哭生男贅婦老而獨但知生女耀門楣高者為山下者谷貓女膩新相鬬妍醉歌跳舞驚鴻翩酋長朝來易版籍東家麻達西家仙接飛軼走縱行横施繡肌雕腋勇者是儀龜文蟬翼蒙表貫肢背展鵰鶚胸獰豹螭跳脱臂釬瓔珞項披蠢然身首犂􅛗之尸海山宜鹿依於樸􅈪麌麌呦呦羣行野伏諸畨即之長鈚勁箙毒㹪横噬倍於殺戮慿藉商手賦公局獲車既傾壑有慾㹔犇狧食何苦辛直朶頤於刖蹄而剖腹爾之生也懸刀代弧爾之壯也畜犬為徒柔筌以卧肉以餔縱横猛氣凌殷虞奮狋㹜不可呼爭先奚翅當百夫功多齒鈍棄匪辜日暮纍纍嘷路隅虎山可深入傀儡難暫逢不競人肉競人首殱首委肉於豝豵驚禽飛駭獸走腰下血糢糊諸畨起相夀崩泉下澗三尺波女兒没水如羣鵝中官投藥山之阿至今仙氣留雲窩生男洗滌意非它無攣無靡無沈疴他日縱浪有勲業為鯨為鯉為蛟鼉鼉鼓轟林人野哭舉尸焮炙昲以燠蠅蚋不敢侵螻蟻漫相逐埋骨無期雨頽屋安置鬼牛與鬼鹿鬼殘日夜傷幽獨金人竄伏來海濱五世十世為天民花開省識唐虞春阡陌雜作如無人披草戴笠鉗口合脣道路以目爰契天真華人侮之黙不嗔秫粒如豆萁如薪羣嚼玉英粲醽醁為氤氲屏五齊三事而狄康不聞凖人凖口量餘粟一榼一瓢萬事足蚩蚩者無懷古民白刃酣交醒觳觫秋日雜詩三首孫元衡諸畨多窟宅深就瘴雲安竹塢疑熊館茅房結馬鞍山荒朝獵豹田熟夜防獾此是羲皇上文身似羽翰信此飄零眼浮觀别異同四時無正候百物有奇功版籍翻稽婦蠻邨渾賤翁糟醨聊可啜應笑學郫筒眼底天民在熙熙共往來忘年驚髪變改嵗待花開即鹿羣看箭安家宻咒灰唱歌爭欵客喚取女郎囘土畨竹枝詞二十四首郁永河生來曾不識衣衫裸體年年耐嵗寒犢鼻也知難免俗烏青三尺是圍闌文身舊俗是雕青背上盤旋鳥翼形一變又為文豹鞹蛇神牛鬼共猙獰胸背斕斑直到腰爭誇錯錦勝鮫綃氷肌玉腕都文遍只有雙蛾不解描畨兒大耳是奇觀少小都將兩耳鑽截竹塞輪輪漸大如錢如椀復如盤丫髻三叉似幼童髪根偏愛繋紅絨出門又插文禽尾陌上飄颻各鬬風覆額齊眉繞亂莎不分男女似頭陀晩來女伴臨溪浴一隊鸕鷀漾綠波鑢貝雕螺各畫攻陸離斑駁碧兼紅畨兒項下重重遶客至疑過繡嶺宮銅箍鐵鐲儼刑人鬬怪爭奇事事新多少丹青摹變相畫圖那得似生成老翁似女女如男男女無分總一般口角有髭皆㧞盡鬚眉都作婦人顔腰下人人挿短刀朝朝摩厲可吹毛殺人屠狗般般用纔罷樵薪又索綯耕田鑿井自艱辛緩急何曾叩比鄰搆屋斵輪還結網百工俱備一人身輕身趫㨗似猿猱編竹為箍束細腰等得吹簫尋鳳侶從今割斷伴妖嬈男兒待字早離孃有子成童任遠颺不重生男重生女家園原不與兒郎女兒纔到破𤓰時阿母忙為搆室居吹得鼻簫能合調任教自擇可人兒只須嬌女得歡心那見堂開孔雀屏既得歡心纔挽手更加鑿齒締姻盟亂髪鬖鬖不作緺常將兩手自搔爬飛蓬畢世無膏沐一様綢繆是室家誰道畨姬巧解釀自將生米嚼成漿竹筒為甕牀頭挂客至開筒勸客嘗夫擕弓矢婦鋤耰無褐無衣不解愁畨罽一圍聊蔽體雨來還有鹿皮兠竹弓箬矢赴鹿場射得鹿來交社商家家婦子門前盻飽惟餘瀝是頭腸莽葛元來是小舠刳將獨木似浮瓢月明海澨歌如沸知是畨兒夜弄潮種秫秋來剪入場舉家為計一年糧餘皆釀酒呼羣輩共罄平原十日觴梨園敝服已蒙茸男女無分只尚紅或曵朱襦或半臂土官氣象已從容土畨舌上掉都盧對酒歡呼打剌酥聞説金亡避元難颶風吹到始謀居深山負險聚游魂一種名為傀儡畨博得頭顱當戸列髑髏多處是豪門臺灣近詠上黄巡使二首藍鼎元畨黎素無知渾噩近太古祗為巧偽引訟爭亦肆侮睚眦動殺機其心將莫禦所幸弗聯屬社社自愚魯太上用夏變衣􅃣與居處使彼忘為畨齊民消黨羽其次俾畏威罔敢生乖迕無虐無令傲服勞安作苦恩勝即亂階喣􅌵䑕為虎所以王道平不為矯枉補内山有生畨可以漸而熟王化棄不收獷悍若野鹿穿箐截人首飾金誇其族自古以為常近者乃更酷我民則何辜晨樵夕弗復不庭宜有征振威寜百谷土闢聽民趨畨馴賦亦足如何計退避畫疆俾肆毒附界總為戕將避及牀褥題同年黄玉圃畨社圖呂謙恒九重渙汗使臣知萬里蠻荒跂踵時耳目全開天海外土風盡入竹枝詞題黄侍御畨社圖陸榮秬日麗中天萬國環八埏風俗版圖間誰言黒齒雕題遠只在麟洲小水灣清時絶島似仙鄉密箐深林化日長捉罷野牛還捕鹿閒來飽飯夜舂糧畨社雜詠二十四首黄叔璥絶島中華古未通生來惟鬬此身雄獨餘一面猙獰外人鳥樓臺刺自工文身剉竹為椽扇縛筊空擎樑上始編茅落成合社欣相賀席地壺漿笑語高作室荒地欲鬆園更腴誅茅覆草令秋枯種時禾秸驚風雨雜植還教薏苡扶種園小樓貯粟號禾間剉竹編茅蓋自間應識名禾知本計可專飲血事搜山禾間蠻孃織作亦殊勤圓木中空槽口分尺布可堪持北去但令知有達戈紋晝織霜鐘雲磬韻雙清何處村莊旋旋鳴北客初來聽不厭那知此是夜舂聲夜舂未負耕犂未服輈誰教馴狎入欄收畨兒自慣無鞍馬大武山頭捉野牛捉牛仰沫巨魚纔躍波矢無虗發巧如何於今苦學漢人法駕筏施罛事轉多射魚地闢年來少鹿場焚林設阱兩堪傷擒生剪耳如黄犢相逐平原互鬬强捕鹿盛植檳榔覆四簷濃陰夏月失曦炎猱升取子飛騰過不用如鈎長柄鎌猱採出草秋深盡夏初刖蹄剖腹外無餘當官已報社商革五穀雞豚一一書社餉獸皮時出内山深互市傳來直至今莫道漢人曾未到熟畨有路敢探尋互市不為穴處不巢顛布毯牢將兩樹纒此味睡鄉人不識不須化蝶自翩翩樹宿社中各自置樓高貓踏更畨未覺勞擊柝宵嚴鏢箭利儘教䑕竊遠潛逃哨望未經牽手尚腰圍習慣身輕走若飛凉夜月明齊展足羡他貓女願同歸鬬㨗製琴四寸截琅玕薄片青銅竅可彈一種幽音承齒隙如聞私語到更闌嘴琴配他弦索亦相宜小孔横將按鼻吹引得鳳來交唱後何殊秦女欲仙時鼻簫贅壻為兒婦是家還憐鑿齒擦蕉花何如高架迎歸去偕老相期禮自嘉迎婦生兒出浴向河濱仙氣長留冷逼人三保當年曾到處南洋諸國盡稱神浴兒殊風雖陋尚堪論恤老收窮古意存長者途逢皆却步朋儕相見亦寒温讓路外沿大海内深溪浮水葫蘆每自擕惟有土官乗筏過衆擎如蟻兩行齊渡溪厯書不識嵗時增月幾回圓稻一登鄰社招邀同報賽竹杯席地俗相仍㑹飲男􅃣毛羽女䰐鬖衣極鮮華酒極酣一度齊咻金一扣不知歌曲但喃喃賽戲紅毛舊習篆成蝸漢塾今聞近社皆謾說飛鴞難可化泮林己見好音懷漢塾臺海使槎録卷八
