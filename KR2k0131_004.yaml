body:
  text: 臺海使槎録卷四常鎮揚通道黃叔璥撰雜著郡縣志藝文榆林髙拱乾臺灣賦率藉中土景物渲染似不足以形容無錫季麒光所著客問獨不作泛設語頗極臺地山川物産之勝諸志略而不載節録數則於左一曰僭號承天東寧錫字乾坤東港華嚴南島近接彭湖遙分哈喇荷蘭起之琉球倚之北憑甌閩西距交廣屬揚州之分𨽻女虛之躔外環大海雲漲煙平內阻重山沙迷霧列中有平原可耕可牧滃水長連崑流交峙吕宋之估帆時集日本之夷舶常通南澳銅山風檣可接海壇東埔飛葦直達蛟龍蜃虺兕豕鯨鯢隱隱沄沄沆沆莽莽遏雲怒風轟雷遁雨固海山之僻壤亦宇宙之奧區二曰木岡大岡以分南北前嶺後嶺以界東西鹿耳當海外之咽喉半線為內山之鎖鑰鳳山則蔥鬱𢎞開猴悶則離竒盤結赤山烏山上港中港鉤嬰橕突攫搏呷呀至若斗六門攀緣鳥道傀儡山曲折羊腸觀音志如來之勝迹鬼仔實魑魅之淵藪萆目琅嶠迤南巨嶂雞籠竹塹極北重關竒嶺之雪峰萬仭南日之煙嶂千尋大武壟大傑巔小琉球小雙寮皆疊岫參差連岡撼戞阿猴林障蔽頑番哆囉嘓交蟠逺社龜佛龜崙雙標天半貓羅貓霧接峙雲中圭心石門崩山後壠重洋底柱攫浪搏潮覷關蹀户當者失據三曰東寧之地惟水是衛淡水江北注之津梁濁水溪南來之門户鹿耳門衝突海口大線頭高據沙洋雞籠城下帆指閩安琉球社外舟通吕宋至如北線尾中樓仔夜靜潮平海翁窟歐汪溪春明浪秀蚊港笨港新港後港竹滬三林或依山回沍冒沒騰流或聚石奔衝昻澎涌溢千里雷馳萬潮煙洶七鯤身毗連環護三茅港匯聚澄泓路分東渡西渡洋别大鄉小鄉鯽魚潭打狗澳漁舟雲集洲仔尾瀨口港鹽格星屯扼其險可以制患資其利可以裕民四曰鹿之生也或斑而文或黧而黝忽散忽聚乍往乍來於是弓矢殪之鏢槊搦之罟穽伏之鉛炮擊之肉堪調簋角則成膠皮毛稛載外洋是資牛之來也千百為羣憑陵溪谷聚飲則涓源為涸回食則蔓草皆赭間以圍椆制以鈎盾百步就羈以耕以駕至乃犬能攫羆羊可燖羮朝飛之雉倚草棲林夜嘯之猿依山緣木豹文隱霧窟藏煙若夫大繒斷流修縺橫海鯊鯧鯉鰋蟶蛤蚶蟳挽青猊之鬛截白黿之皮搜龍籍羅蜃府莫不布雕爼就臠切具糅五味腥膏饜飫五曰重山之中産有異材工師操斧匠氏持柯楠榕杉樟桑桕槐栁莫不枝覆層岡幹依連麓舒目而望之青茅白葦紫藁蒼蘆鬱若深林叢如列嶂代瓦以覆易牆以圍至如檨柚之茂葉翳日檳榔之修幹參雲蕉擅緑天荔垂朱實山則不童地鮮不毛土之良也六曰墳壚斥鹵五穀是滋以稼則蕃以種則碩水耕火耨不營而足上地可七下地可二宜粳宜稻宜菽宜稷禾秫赤秫早占晚占秬黍蘆黍紅秈白秈豆分黃緑麥别大小莫不纍纍淋淋顆顆的的甌寠滿篝汙邪滿車黃雲紅玉相積陳陳於是牛馬運之舟航載之以徵以貢和鈞兵卒家有稼穡之利人有作甘之用桐城孫元衡字湘南素工詩官臺灣同知所著赤嵌集王阮亭司寇謂裸人叢笑篇及咏禽魚花草諸什可作臺灣圖經風土志竟可自為一書而諸志絶不之及余因摘録一帙並無錫季麒光蓉洲文稿數十篇書付陳觀察大輦續修府志為之補入東吟詩一名福臺新咏四明沈光文宛陵韓又琦關中趙行可會稽陳元圖無錫華衮鄭廷桂榕城林奕丹霞吳蕖輪山楊宗城螺陽王際慧前後倡酬之作吳有桴園詩集楊有碧浪園詩又東吟倡和詩季麒光與臺令沈省軒所作省軒郊行一集多寫民間疾苦麒光著有山川考略海外集惜俱未見今則兵燹之後官僚救過不暇無復寄情翰墨矣武林郁永河臺灣竹枝詞鐵板沙連到七鯤鯤身激浪海天昏任教巨舶難輕犯天險生成鹿耳門雪浪排空小艇橫紅毛城勢獨崢嶸渡頭更上牛車坐沙堅水淺小艇不能達岸必藉牛車挽之日暮還過赤嵌城編竹為垣取次增官署皆無垣墻插竹為籬衙齋清暇冷如氷風聲撼醒三更夢帳底斜穿逺浦燈耳畔時聞軋軋聲牛車乘月夜中行夢回幾度疑吹角更有牀頭蝘蜓鳴蔗田萬頃碧萋萋一望蘢蔥路欲迷稇載都來糖廍裏只留蔗葉餉羣犀青蔥大葉似枇杷臃腫枝頭著白花看到花心黃欲滴家家一樹倚籬笆芭蕉幾樹植墻隂蕉子纍纍冷沁心不為臨池堪代紙因貪結子種成林獨幹凌霄不作枝垂垂青子任紛披摘來還共蔞根嚼贏得唇間盡染脂惡竹參差透碧霄叢生如棘任風搖那堪節節都生刺把臂林間血已漂不是哀梨不是楂酸香滋味似甜瓜枇杷不見黃金果番檨何勞向客誇肩披鬒髮耳垂璫粉面朱唇似女郎梨園子弟垂髫穴耳傅粉施朱儼然女子媽祖宫前鑼鼓閙海舶演劇酬願侏離唱出下南腔閩以漳泉為下南臺灣西向俯汪洋東望層巒千里長一片平沙皆沃土誰為長慮教耕桑各志多取沈文開雜記未得全書亦不知其人蓉洲文稿文開傳名光文四明故相文恭公世孫字文開别字斯菴以恩貢歷仕紹興福州肇慶由工部郎中加太僕寺少卿明鼎革後遁迹不仕辛卯從肇慶至潮州由海道抵金門當事書幣邀之不就七月挈眷買舟赴泉過圍頭洋遇颶風飄泊至臺及鄭大木掠有其地斯菴以客禮相見鄭經嗣爵多所變更斯菴以一賦寓譏諷為忌者所中乃改服為僧入山不出在厦門時與將軍施侯為舊識及侯安撫東寧慰問夙昔斯菴仍著僧衣姚少保亦與友善許贈資回籍姚死事遂寢亦遂不能作歸計矣所著臺灣賦東海賦檨賦桐花賦芳草賦及花草果木雜記古近體詩俱係存稿未及梓行余巡厯所至見臺地花果有內地所無者命工繪圖得二十餘種余為考其種類辨其色味以識之或曰此可作埤雅爾雅翼外紀則吾豈敢華亭吳太史王坦陸太學榮秬崇明柏太史謙展圖題句吳詩云爾雅自姬公搜討窮大塊後有山海經所言同志怪荒略何從稽於説亦荑稗乃知天地間賦形各萬派若非域外遊直猶等聾瞶巡方繡衣行幾及扶桑界東溟凌滄波驚濤厯淜湃既至振紀綱問民軫病瘵聞見往往殊耳目為一快其中植物繁羅列登市賣五色爛然陳厥狀難盡話細文如錦章粗文如方罫枝葉非尋常異味皆可嘬召工寫此圖摹仿在公廨碧緑與丹砂肖真事揮灑稱名復辨種按之悉能解我生里閈間未得廣行邁多識慙古人拘墟徒自絓晴窗試展看意曠若脫械虛名玷使星願無逺弗屆陸詩云名象遙傳東海東根苗無可問鴻濛波羅蜜與菩提種猶有林藤地味風如斗如拳碩且繁不離海島托雲根甜酸苦辣皆成實總荷天家雨露恩番果圖又吳詩搖曵珠幢翠帶長紫霞一片護花房金蓮樂樹知無色七寶闌中自在芳少許猊牀侍釋迦一家眷屬見曇花遙知使節風清候攜得金莖灑異葩珍果圖來命畫師拈花又寫佛前枝窗明几淨清茶供絶勝黃金鑄像時柏詩西域誰攜仙種回曇花喜雜瘴煙開分明遺贈皇華使不令空王獨占來一帆飄渺駕長川留取竒花入畫姸却笑君房浮海去不傳芝草長瓊田曇花圖紀異朱文公登福州鼓山占地脈曰龍渡滄海五百年後海外當有百萬人之郡今歸入版圖熙熙穰穰竟成樂郊矣康熙丙申北路石洞水上出火數日乃熄壬寅嵗亦有見者此處水熱或謂即溫泉磺氣鬱蒸水石相激而火生焉荷蘭為鄭成功所敗地大震鄭克塽滅地亦震朱一貴於辛丑作亂庚子十月亦地震維時南路傀儡山裂其石截然如刀劃狀諸羅山頽其巔噴沙如血土人謂兩山相戰壬寅七月十一日鳳山縣赤山裂長八丈闊四丈湧出黑泥至次日夜間出火光髙丈餘熱氣炙人多不敢近有疑出磺者參將陳倫炯報稱赤山上一崙頗平東南二百餘步臨冷水坑縱橫百三十步土人稱自紅毛偽鄭及入版圖後遞年出火或連兩晝夜或竟日夜止今自申至丑焰較昔年稍低炯查硫穴土色黃黑不一佳者質重有光芒風至硫氣甚惡半里草木不生今近火處草色蔚青遍山土番種植土色亦無光芒濕處有如黑泥及乾色白輕鬆與土無異雖按法煎煉全無磺味或曰此係豐年之兆乃於十八日己午颱風大作迅烈異常更兼暴雨傾注縣治民舍營房多被摧折幸兵民人口尚無壓斃芒蔗及早稻成實者亦間有損傷雍正癸卯六月二十六日赤山邊酉戌二時紅光燭天地衝開二孔黑泥水流出四圍草木皆成煨燼七月十六日至二十日颱風驟雨發作無節淡水數處民田衝陷兩次火見即兆風災風自火出殆一定之理耶康熙壬辰七月安平有物大如牛髙可五六尺面如豕長鬚雙耳竹批牙齒堅利皮似水牛毛細如獺四足如龜有尾飛行水上土人爭致之繩木立碎後逐至海岸竦身直立聲三呼號聞者莫不驚悸既死郡人有圖形相告者究不知為何物或名為海馬亦非也海上事略康熙癸亥四月彭島忽見鱷魚長丈許有四足身上鱗甲火炎從海登陸百姓見而異之以冥鈔金鼓送之下水越三日仍乘夜登山死於民間厨下按鄭成功起兵荼毒濵海民間患之有問善知識云此何孽肆毒若是答曰乃東海長鯨也問何時而滅曰歸東即逝凡成功所犯之處如南京溫台并及臺灣舟至海水為之暴漲順治辛丑攻臺灣紅毛先望見一人冠帶騎鯨從鹿耳門而入隨後成功諸舟由是港進癸卯成功未疾時轄下夢見前導稱成功至視之乃鯨首冠帶乘馬由鯤身東入於外海未幾成功病卒正符歸東即逝之語則其子若孫皆鯨種也今鱷魚登岸而死識者知其兆不佳至六月彭師戰敗歸誠亦應登山結果之兆焉康熙辛丑五月二十八日大雨如注六月六日始晴山摧川溢溪澗閼塞田園沙壓瀨口有大牛冒雨奔騰下岸入水過三鯤身登陸由鎮城從柴橋頭入海向大港而出小艇追之不及而還此不知為鱷為鯨為水牛或兆鴨母之亂旋即殱滅乎偽鄭附略紅夷犯順鄭芝龍攻擊大擔偵知夷䑸分泊彭湖設計勒捕焚夾板一隻擒酋七名後直抵料羅麾令參將陳鵬等首衝夷陳生擒酋長因用牽扯焚燒之法會同副總髙應嶽遊擊張永産彭湖遊兵遊擊王尚忠等夾擊焚大夾板五隻賊小船五十餘隻生擒偽夷王呷咇嘽吧哇一名前後計擒賊衆百餘名斬級二十顆焚溺以千計此從來未見之死戰亦從來未見之竒捷又云芝龍渾身是膽屢建竒功海上之旌旗指顧不啻摧枯而拉朽按閩摘略按此在崇禎六年志云天啓元年東洋螺甲顔思齊與鄭芝龍引倭據臺施琅請留臺灣疏崇禎元年芝龍就撫將臺地稅與紅毛為互市之所此正在就撫之後鄭芝龍泉郡南安人明季與劉香老嘯聚海上既而投誠授遊擊將軍順治乙酉分兵南下芝龍以兵降鄭成功芝龍庶長子也小字森舍時年十七為諸生方衣單絺間步階前聞父降咨嗟太息掉小舟至厦門隔港之古浪嶼招集數百人方苦無資適有賈舶自日本來二僕在焉資近十萬成功悉以其資募兵製械從者日衆竟踞金厦門內地港澳悉設舟師登陸為寨扼守水口又遍布腹心於內地事無巨細皆得早聞為備故以咫尺地與大兵拒守三十餘年我朝嚴禁通洋片板不得入海而商賈壟斷厚賂守口官兵潛通鄭氏以達厦門然後通販各國凡中國各貨海外皆仰資鄭氏於是通洋之利惟鄭氏獨操之財用益饒日本最富強聞鄭氏兵精頗憚之又成功為日本婦所出有求必與故府藏日盈自傳位子經適當耿逆叛亂與鄭失好耿兵方圖內向鄭兵即躡其後已據閩之興漳泉汀粵之潮惠七郡養兵之用悉資臺灣自此府藏虛耗敗歸之後不可為矣成功蓄志內侵造戰艦三千餘艘順治十三年窺江南過浙之東甌泊舟三日連檣八十里至江南羊山山神嗜羊海舶過者必置一生羊日久畜息不可數計鄭氏戰艦泊山下將士競取羊為食大風驟至人船傷損什之七八十六年復大舉入寇襲京口犯江寧成功重操練舳艫陳列進退以法將士在驚濤駭浪中無異平地跳躑上下趫捷如飛將帥謁見甲胄僅蔽身首下體多跣足不褌有以靴履見者必遭斥罵凡海岸多淤泥陷沙惟跣足得免沾滯往來便捷閩督陳景駐師漳郡力圖進勦鄭氏沿海拒守有門子李文忠素機警為景親信實隂通鄭氏一日夜入制府卧內刺其首并竊令箭出南門稱有軍機無敢詰者以首獻成功成功惡其弒主薄與一官不滿所望歲餘以他事斬之龍碽者大銅炮也成功泊舟粵海中見水底有光上騰數日不滅使善泅者入海見兩銅炮浮遊往來命多人持巨縆出之一化龍去一縛出斑駁陸離光艷炫目較紅衣炮不加大而受藥獨多先投小鐵丸斗許乃入大彈所至糜爛成功行師必載與俱龍碽有前知利即數人曵之不知重否則百人挽之不動以卜戰勝莫不驗康熙十八年劉國軒將攻泉郡龍碽不肯行強舁之往及發又不然國軒怒杖之一發炸烈如粉傷者甚衆偽鄭逸事鄭成功攻取紅毛改臺灣為東都鄭經自銅山入臺改東都為東寧省䦖鄭國城門名偽鄭據紅毛城因取以名內城之門順治十六年鄭成功大舉入寇七月抵焦山進據瓜州趨鎮江直薄金陵八月至觀音門我師以步卒搗其中堅而以騎兵繞山後出其背前後夾擊成功大敗十七年五月世祖命將軍達素總督李奉泰率兵大搜兩島厦門金門十八年議取臺灣三月成功泊彭湖次鹿耳門紅夷大驚成功引兵登陸克赤嵌城十二月圍王城不下成功乃使人告之曰此地乃先人故物今我所欲得者地耳餘悉以歸爾荷蘭乃降康熙元年成功卒二年天子鋭意南征遣人約紅夷合兵攻島大兵入兩島之賊殲焉三藩紀事康熙庚申十月偽鄭毁雞籠城雞籠係海嶼𨽻臺灣北山居淡水上遊其澳堪泊百餘艘先時吕宋化人裔占據此城與土番貿易因出米稀少逺餽不給棄去後紅毛及鄭國姓據臺灣皆不守癸卯總督李奉泰召紅毛合攻兩島約復臺灣後許貢就閩省交商紅毛於乙巳年重修雞籠城圖復臺灣丙午鄭經令勇衛黃安督水陸諸軍進攻偽鎮林鳳戰死紅毛慮無外援隨棄去至是有傳我師欲從北飛渡恐踞此城乃遣右武衛北哨密令督兵將城拆毁辛酉令偽鎮何祐等北汛雞籠驅兵負土就舊址砌築并於大山别立老營以為犄角兵士疲勞兼時值炎天居處磺地手足斷爛不可勝計偽鄭無定謀猶如兒戲雞籠一城始也毁而棄之繼也築而守之模稜之見徒苦生靈耳海上事略明時原住彭湖百姓五六千人原住臺灣二三萬人俱耕漁為生順治十八年鄭成功帶內地水陸偽官兵辨男女計三萬有竒康熙三年間鄭經復帶內地偽官兵辨男女約六七千人賊中無家者十五六靖海紀天下一統胡為一鄭經殘孽盤踞絶島而折五省邊海地方畫為界外以避其患自古帝王致治得一土則守一土安可以既得之封疆而復割棄况東南膏腴田園及所産魚鹽最為財賦之藪可資中國之潤不可以西北長城塞外風土為比倘不討平臺灣匪特賦稅缺減民困日蹙即防邊若永為定制錢糧動費加倍又邊防持久萬一懼罪辨兵及冒死窮民以為逋逃之窟遺害叵測且鄭成功有十子遲之數年長成假有一二機覺才能收拾黨類結連外國聯絡土番羽翼復長終為後患督臣姚啓聖調兵製器奬勵士卒精敏整暇咄嗟立辦捐造船隻無所不備矢志滅賊非臣所能及惟是生長北方雖有經緯全才汪洋巨浪中恐非所長臣謂督臣宜駐厦門居中節制别有調遣臣得專統前進行間將士知有督臣後趲糧運策應則壯志勝於數萬甲兵今若與臣偕行征糧何以催趲封疆何有仰賴安內攘外非督臣斷難彈壓緩急所有督臣題定功罪賞格俾臣循例而行則大小將士咸皆凛遵施襄壯疏略癸亥我師議取臺灣鄭克塽將偽鎮營兵官眷口監羈紅毛赤嵌二城堅其死戰偽延平王鄭克塽偽侯劉國軒差偽禮官鄭平英偽賔客司林惟榮等齎表請降表云臣祖成功篳路以闢東土臣父經韎韋而雜文身寧敢負固重險自擬夜郎抑亦保全遺黎孤栖海角而已乃者舳艫西下自揣履蹈之獲愆念此氣血東來無非霜露之所墜顔行何敢再逆革心以表後誠昔也威未見德無怪鳥駭於虞機今者悟已知迷敢後麟遊於仁圃癸亥七月鄭克塽差偽兵官馮錫圭等齎降本稿到彭湖軍前施琅差侍衛吳啓爵筆帖式常在往臺灣看驗偽官兵剃髮克塽復差錫圭等同啓爵在齎降本并繳延平王印一顆册一副輔政公鄭聰印一顆武平侯劉國軒印一顆忠誠伯馮錫范印一顆左武衛將軍何祐印一顆尚有招討大將軍印一顆稱有户口兵馬册籍未造暫留候繳琅攻取彭湖獲紅衣大銅炮十二位每位重四五千斤炮子大者二十餘斤中者十七八斤次者十四五斤鉎鐵大炮二位每位重七千餘斤炮子三十餘斤雞籠城貯鐵炮明崇禎三年鑄兵部尚書何喬逺監造鄭成功得之鎮江者彭湖臺灣向屬夷島明末迄國初鄭寇竊據逮鄭歸命夷島亦入版圖為詩以紀之曰海中島各一方耳無帝目無王古若兹况漢唐勝國末鄭冦強踞其壤恣跳梁乘潮汐駕帆檣肆侵掠毒閩疆皇赫怒整斧斨命樓船下扶桑寇日蹙乃求降陬兼澨梯且航置郡縣破天荒貢皮幣賦蔗糖銷兵氣日月光勞之辨集朱逆附略康熙辛丑六月初三日上諭臺灣衆民據督臣滿保等所奏臺灣百姓似有變動滿保於五月初十日領兵起程朕思爾等俱係內地之民非賊冦之比或為飢寒所迫或為不肖官員剋剝遂致一二匪類倡誘衆人殺害情知罪不能免乃妄行強拒其實與衆何涉今若遽行征勦朕心大有不忍故諭總督滿保令其暫停進兵爾等若即就撫自諒原爾罪若執迷不悟則遣大兵圍勦俱成灰燼矣臺灣只一海島四面貨物俱不能到本地所産不敷所用祗賴閩省錢糧養生前海賊占據六十餘年猶且𠞰服不遺餘孽今匪類數人又何能為諭旨到時即將困迫情由訴明改惡歸正仍皆朕之赤子朕知此事非爾等本願必有不得已苦情與其坐以待斃不如茍且偷生因而肆行虜掠原其致此之罪俱在不肖官員爾等俱係朕厯年豢養良民朕不忍𠞰除故暫停進兵若總督提督總兵官統領大兵前往圍𠞰爾等安能支持此旨一到諒必就撫不得執迷不悟妄自取死特諭朱寇警報至郡總兵歐陽凱令遊擊周應龍帶兵四百人并調新港目加溜灣蕭壠麻豆四社土番隨往應龍傳諭殺賊一名賞銀三兩殺賊目一名賞銀五兩土番性貪淫殺良民四人縱火燔民居復斃八人載道股栗賊黨借兵番殺掠為辭鼓煽村莊由是紛紛響應號召竪旗殺總兵全臺陷沒平臺紀略周應龍駐兵楠仔坑軍士風餐露宿每多怨咨羽書告急立弔北路番為先鋒厯處奪民衣食掠淫漢婦妄殺平民槩不禁制居民遭畨戕毒各里社會立偽旗賊勢益振逮後府中紛紛避難縣官出入單騎無侍從新港土番率衆至府白晝劫奪百姓羣殺之縣官不敢與聞臺陽運會編朱一貴原名朱祖岡山養鴨作亂後土人呼為鴨母帝賊夥詭稱海中浮玉帶為一貴造逆之符既得郡治一貴自稱義王僭號永和以道署為王府餘孽有平臺國公開臺將軍鎮國將軍內閣科部巡街御史等偽號散踞民屋劫取戲場幞頭蟒服出入八座炫耀街市戲衣不足或將桌圍椅背有綵色者披之冠不足或以紅緑紬紵色布裹頭以書籍絮甲變後居民避難絡繹海上風恬浪靜寸艇飛渡不畏重洋之險大師自六月十六日進鹿耳門十七日下安平鎮二十二日復府治未及浹日奏捷先是童謡有云頭戴明帽身穿清衣五月永和六月康熙先鄭逆流毒沿海州郡逮破金厦兩島賊退守臺彭越二年乃滅之朱一貴為亂未兩月便授首二事遲速不同何也蓋鄭逆竊踞海上厯有年所黨與尚多且踞彭湖是臺灣多一門户故其道主緩圖而為萬全之計朱一貴雖號稱十餘萬賊率係烏合之衆時水師副將許雲度勢已不支揮民船使歸內地厰內戰艘未成者悉焚之賊故不得取彭湖又與賊將杜君英相攻殺故其道主急攻而得制勝之術此其所以異也然而有同焉者臺灣南北中三路皆有港門可入中路鹿耳門最稱險要乃前者將軍施琅誓師期諸將取鹿耳門後者總督滿保詭稱三路並發及期仍令齊攻鹿耳門何也蓋鹿耳門一入便登安平鎮港內戰艘均在是巳斷其出海之路矣安平隔港即臺灣府賊失鹿耳門必退守七鯤身我師由陸可以直攻其首由水可以衡攻其腹水陸合攻賊必不支府地又無城郭可守便當引去南北二路黨與孤危不過傳檄可以立定矣此其所以同也抑聞之康熙癸亥年克鄭逆舟進港時海水乍漲康熙辛草年克朱一貴舟進港時海水亦乍漲前後若合符節蓋由聖人在上海若效順王師所指神靈呵護理固然耳然在臣子效命必求萬全老將行師自有授受所以閉門造車出門合轍者此中蓋有機焉夫機有二義一曰機謀之機謀則至精至確故其機不可失而後一舉有必勝之方略一曰機緘之機緘則至慎至密故其機不可露而後百發有百效之韜鈐况臺灣為海疆最要地用兵乃國家之機事持籌者使將士奉令以往成功而退可矣而不必使明其故者蓋有深意在也平臺異同島嶼之在外海者皆荒煙草樹魚龍窟宅盜安所憑在內海者則汛防星列棊布稍有見聞便行擒捕盜無由伏惟臺灣一區沃壤千里人衆百萬五穀狼藉物貨畢充近海諸郡皆資臺灣所産而且地盡東南之表則生番隔絶港有砂石之阻則門户據險至於重洋逺隔風信難定所以前代狡賊踞此為雄後奪之紅毛又奪之鄭成功閩粵之害惟此數為盜藪耳康熙六十年間朱一貴復倡為亂是雖太平至治之時而一二姦民暴夫猶不忘亂心如此也然則治之當如何無事之日責在賢良之司老成之帥熟識風土體察人情愛民肅兵培植元氣安不忘危弭亂未萌萬一有事法宜急平毋使滋蔓蓋乘其羽翼未大張根本未甚固則易為力此其機不可失者也然要必其熟識於臺彭之形勢三十六島之灣澳南北中路之港門風雲妙合之天時番民莊社之情形與夫用兵機宜素講其理而親其事者然後可任以大權而功立成至於輸餉饋糧以及舟艦甲仗咄嗟立辦選將行師一呼立應使內地不擾而軍務畢集人事先定而天時可計此其責惟在於大府之平時留心斯臨事調遣裕如耳理臺末議八月十三日夜臺灣颶風大作倒壞衙署倉厫民房傷損船隻人民田禾上召入九卿詹事科道面諭臺灣颶風大作官兵商民傷損甚多朕心甚為不忍前朱一貴等謀反大兵進勦殺戮已多今又遭風災書云大兵之後必有凶年地方茲言信然總因臺灣地方官平日但知肥已剋剝小民激變人心聚衆叛逆及大兵進勦征戰殺戮上干天和颱颶陡發倒塌房屋淹沒船隻傷損人民此皆不肖有司貪殘所致今宜速行賑恤以慰臺民九卿議照保安沙城地震散賑之例倒房一間銀一兩壓死大口一口銀二兩小口一口銀七錢五分被風傷船壓死兵丁應照出兵病故官兵每名賞銀五兩給伊等妻子臺灣縣倒厝五千八百八十一間壓死男婦大小三十八口共賑銀五千九百四十四兩五錢鳳山縣倒厝三千三百六十五間壓死男婦大小二十九口共賑銀三千四百十九兩二錢五分諸羅縣倒厝一千四百四十二間壓死男婦大小八口共賑銀一千四百五十六兩七錢五分各營壓死兵丁一百二十名共賞銀六百兩又敕下蠲免三縣六十年額征民番銀二萬二千二百十五兩四錢零粟十三萬八千九百五十二石六斗零被災民番大口給粟二斗小口給粟一斗臺灣縣民五千五十八口共賑粟九百三十七石五斗鳳山縣民番八千八百六十七口共賑粟一千四百八十七石六斗諸羅縣民番八千五百六十六口共賑粟一千三百六十五石三斗漳浦諸生藍鼎元著有東征集平臺紀略諸羅教諭蔡芳有平臺始末同安黃耀炯有靖臺實録言之詳矣漳浦明經陳夢林鹿耳門即事八首并自注附録於左征帆搖曵海無波回首滄桑一擲梭前後三從此地入安危幾度險中過頑民革面干戈戢諸將承恩節鉞多獨有書生仍故我白頭杖策待如何東港由來各一天興朝覆載獨無偏地袤南北二千里人樂耕漁四十年習染漸澆爭靡麗民風尚力雜機權當時載筆空愁思滿目煙花正鬬姸地震民訛桐不華庚子春有髙永壽者詣帥府自首云至琅嶠一人乘筏引入山後大澳中船隻甲仗甚盛中渠帥一人名朱一貴云云鎮道以為妖言杖枷於市辛丑羣賊陷郡治議所立因以朱祖冒一貴名賊平遣人入琅嶠遍覔並無其處亦異事也是年冬十一月地大震臺多藾桐辛丑春闔郡無一華者有妖僧異服倡言大難將至門書帝令二字則免僧即賊黨也賊平僧伏誅處堂燕雀自喧譁無端半夜風塵起幾處平明旌斾遮牧豎橫篙穿赤甲時官軍寡弱賊衆至數萬多以竹篙為槍將軍戰血漫黃沙副將許雲參將羅萬倉遊擊遊崇功守備胡忠義馬定國千總陳元蔣子龍林文煌趙竒奉把總林富林彥石琳俱戰死把總李茂吉不屈罵賊死傳聞最是遊公壯登岸飄然不顧家四月草九日崇功自笨港巡哨還入鹿耳門官眷有下船者崇功頓足曰官者兵民之望官眷下船則兵民心散大事去矣時賊已逼郡亟登岸壻蔡姓者叩馬固請願一過家門區處家屬崇功厲聲曰吾此身朝廷所有今日那知有家躍馬麾衆竟去前後連戰凡手刃數十百人崇功既殉蔡亦赴海死萬頃洪濤沙線瀠參差竹樹亦干城非關羣盜全無策漫説元戎有勝兵風自西來知順逆船從淺入任縱橫潮頭頃刻髙尋丈天佑皇圖孰與爭六月十六日亭午西風大作潮長六七尺戰艦堆行齊入鹿耳門遂克安平沙磧甘泉信有神廟謨𢎞逺古無倫鯤身合戰齊羣力西港分竒仗虎臣十七十九日賊犯鯤身殊死戰我兵大破之草二日總兵藍廷珍率林亮魏大猷等分兵由西港仔登岸賊大敗長驅至郡諸路兵合遂克郡泊草竊頓消氷見晛天兵到處雨清塵等間一月全臺定何似有苗格七旬刀劫火輪萬象凋黑風紅雨又漂搖八月十三夜颶風發屋拔木大雨如注昏黑中紅點飄揚夾雨紛飛漏盡風雨乃止民居倒塌無數營帳船隻十無一存死傷者千有餘人才看肆赦銜丹鳳忽聽蠲租下九霄瘡病人扶村竈冷拊循力盡長官憔時死傷載道次年春夏間米價騰湧文武官厨一日兩粥平糶散賑戴星出入至秋人心乃定轉移薄俗從今日只在君王十六條絶島重洋古穢墟棄留曾費幾躊躇原資保障安封內寧屑刀錐增幣餘亂後賦須仍舊額法寬農好治新畬眼看磽確草萊盡尺寸何當軍國儲南從虎尾北雞籠建邑當年議頗同壬寅於詔允巡使請半線增設彰化縣地逼諸番宜扼吭址因故鎮更稱雄天心悔禍民更始帝德昭明日在東巡使從奏釋餘黨之寄語王官好著意無忘前事曠天工康熙六十一年七月余奏請勒緝餘孽寬免株連疏略云臣聞得朱一貴餘孽王忠劉育等逃匿內山不時出沒本年四月初九日夜殺竹仔腳塘兵鎮臣藍廷珍遣辨追捕於五月初三等日獲賊林千林榮朱崑生等供王忠等先於四月內欲到三林港偷船出海因無船隻退入得寶寮今又至內山清水寮潛伏鎮臣令辨兵搜緝未獲將空房燒燬臣竊思內山南北兩路相通水陸隘口甚多賊奔竄不常辨兵防禦稍疏即受其害若不竭力搜捕終為臺郡之患查凡承緝賊犯原有定例今已逾一年尚無蹤迹伏祈皇上敕部嚴勒限期緝拿限滿無獲從重處分文武官辨內有能設法擒獲者即從優議敘庶人人鼓舞協力同心爭相搜捕王忠等指日可擒再朱一貴作亂時令民割辮以為記認其中或被姦匪倡誘或被抑勒脅從去年聖諭明如日月聞宣布之後士民俱慶更生自首惡既誅緝獲餘孽解赴省城審訊陸續供扳之人不時拿解牽連不已人心時懷驚懼仰請聖主施寬大𢎞恩敕下督撫將拿獲真犯審明正法其餘免其株連曉諭黎庶豫以維新則大法既昭而海疆小民安居樂業永戴皇仁世世矣敕部議行雍正元年四月十五日千總何勉在鳳山林拿獲王忠并劉富生陳郡等三名余隨具摺將報獲逸賊日期奏聞超擢何勉北路營參將世襲拖沙喇哈番臺灣始入版圖為五方雜處之區而閩粵之人尤多先時鄭逆竊踞海上開墾十無二三逮鄭逆平後招徠墾田報賦終將軍施琅之世嚴禁粵中惠潮之民不許渡臺蓋惡惠潮之地素為海盜淵藪而積習未忘也琅沒漸弛其禁惠潮民乃得越渡雖在臺地者閩人與粵人適均而閩多散處粵恆萃居其勢常不敵也康熙辛丑朱一貴為亂始事謀自南路粵莊中繼我師破入安平甫渡府治南路粵莊則率衆先迎稱為義民粵莊在臺能為功首亦為罪魁今始事謀亂者既已伏誅則義民中或可分别録用以褒向義加以嚴行保甲勤宣聖諭使食毛踐土之衆一其耳目齊其心志則粵民皆良民也何以禁為故曰聖王不易民而化理臺末議南路淡水三十三莊皆粵民墾耕辛丑變後客民閩人呼粵人曰客仔與閩人不相和協再功加外委數至盈千姦良莫辨習拳勇喜格鬬倚恃護符以武斷於鄉曲保正里長非粵人不得承充而庇惡掩非率徇隱不報余時飭所司調劑而檢察之報滿擬陳請將外委多人分發閩廣各標營差操能者授以職不堪委用者斥還本籍不惟可清冒濫亦以殺其勢也尋被誣就質於杭不果臺海使槎録卷四
