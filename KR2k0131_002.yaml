標營船初俱分派通省内地㕔員修造康熙三十四年改歸通省内地州縣其尚可修整而不堪駕駛者内地之員辦運工料赴臺興修迨按糧議派臺屬三縣亦分修數船此非偏庇臺屬以内地各厰員多力分工料俱便不煩運載可以尅期報竣後定左近道府監修統計閩省船隻匀派通省道府乃將臺彭九十八船内派臺灣道府各十八隻餘俱派入内地既而仍歸内地修造惟未至朽爛而不堪駕駛者留臺修補至康熙四十四五年間仍俱改歸臺屬而派府船數倍於道然令其與福府分修議於部價津貼運費外每船捐貼百五十金續交延糧㕔代修其半道鎮協營㕔縣共襄厥事迨後專責知府并將道船亦歸於府矣臺郡修船桅木大吉杉木等料並釘鐡油麻㯶絲網沙篾片蓬葉俱非臺地所産逺購福州料價運費不貲再大木附搭商船裝載往年被風覆溺多案船户深畏之至樟枋厚力木在鳳諸内山鳥道羊腸澗溪阻隔僱匠砍鋸僱夫肩運動輒經月泥淖尤難計日且從前山厰近遭焚燬今另為搭蓋尤為煩費需時况附近水沙連等社接壤生番最易啟釁此辦料之難也又臺厰修艌各匠原止二三十人向己不敷撥僱今經變亂或逃回内地或為賊殺害見在無幾一舉大工内地僱募非易僱價較内地數倍此又募工之難也每遇修船將備兵目恣意苛求或將完固勒今修改或稍有損裂故行殘毁或將板木藏匿致累多費工料興工時又於配定丈尺將大斵小將長截短又於修整合式之工搜剔拆換逼使加添又或押船赴修之兵乘夜伺隙偷竊料物則是既苦辦料僱夫之難又苦弁兵之擾累所以臺地船工領價貼運必賠貼兩倍而後得竣也臺守高鐸申詳制府請查照往例將船身朽爛者内厰補造尚堪駕駛而應修者駕赴内港興修其尚可修整而不堪駕駛者留在臺灣交營興修文員仍遵例監視將府莊遞年所收官租為津貼修船之資不惟節費且易於集事重工務而保殘疆實於臺地有益前此覆轍患在兵虛將惰而虛兵之原皆由臺地招兵換名頂替蓋兵從内地抽撥逃亡事故不為申報每至放餉即留餉以飽私槖即有召募强半市井亡賴空名掛籍含混欺䝉則主帥大府之過也當責總兵不時清釐使隨丁悉照定制空糧悉行撥補無籍之人一名不得妄招到伍之兵一名不得頂替則虛冒之弊可除兵既充伍而訓練尤所當亟講者撥換入班即宜配明隊伍將統弁弁統隊隊統卒清查器械不足者補之不精良者淬礪之按期操演各營將操期并演何技勇逐月彚報務使兵與將習手與器習而後可而分汛又當斟酌變通臺地遼闊大汛駐兵一二百名或數十名究之官多離汛兵多聚賭有汛防之名無守望之實多兵亦奚益乎防汛分作幾處匀作幾班統以該汛弁目於本汛鄉莊市鎮山口港隘分地劃界巡哨偵探有事則飛報本營酌量調遣追捕無事則逺者一月一換近者半月一換歇班之兵歸營操練更番戍守人無偏勞聲息可以時通庶賣汛舊弊自此絶矣巡哨海口責之水師逺近島嶼必明港澳險易叢雜交錯之區上下風濤必察灣泊向背取水風候之所善其舟楫械器習其行陣擊刺定其游巡往來毋潛伏内港空文申報駕駛既熟乘風自易則整練平時可資備禦出師勦捕可成勁旅寧有兵虛將惰之患哉習俗臺地民非土著逋逃之淵藪五方所雜處泉之人行乎泉漳之人行乎漳江浙兩粤之人行乎江浙兩粤未盡同風而異俗且洋販之利歸於臺灣故尚奢侈競綺麗重珍㫖彼此相傚即傭夫販竪不安其常由來久矣賭博惡業也父不禁其子兄不戒其弟挾貲登場呌號爭鬨始則出於典鬻繼則流於偷竊實長奸之囮也又莫甚於要盟豪健家兒聚少年無賴之徒指皎日以盟心撫白水而矢誓稱兄呼弟出妻拜母自謂古道相期不知往來既頻則淫酗之累作聲援既廣則囂競之患生若其喪不停柩婢不愆配猶為近古之風而視疎若親窮乏疾苦相為周恤亦荒島之善俗也諸羅雜識婚禮倩媒送庚帖三日内家中無事然後合婚間有誤毁器物者期必改卜納采簪珥綢帛别具大餅豚肩糖品之屬謂之禮盤無力者止煩親屬女眷送銀簪二名曰挿簪仔及筓送聘或畨錢一百圓或八十六十四十圓綾綢數十疋以至數疋禮書二函則收一回一羊豕香燭彩花蔞葉各收其半禮榔雙座以銀為㯽榔形每座四圓上鐫二姓合婚百年偕老八字收二姓合婚一座回百年偕老一座貧家則用乾㯽榔以銀飾之福壽萬字糖或百餘圓或數十圓回以大餅其餘鹿筋鹿脯魚蟳肚肺糖果留三四種各以稻榖麥豆置於盤内又回禮錫盆二如大椀式一植石榴一株用銀石榴三四顆及銀桂花數朶纒繞枝頭名曰榴桂一植蓮蕉花一株取連招貴子之義土人蕉招同音此納幣之禮也親迎先期送擇日儀番錢或四十圓以至十二圓名曰乞日至期不論貴賤乘四人輿鳴金鼓吹彩旗前導親朋送燈少年子弟分隊擎執沿途㸃放爆竹壻至女家駐轎庭中連進酒食三次飲畢外弟攜籃於轎前索爆竹壻隨取贈名曰舅子爆新人出㕔拜祖先次拜父母父兄把酒三盞覆以手帕上轎粧奩同行豐儉不一花轎後懸竹篩上畫太極八卦到門新郎擎蓋新婦頭上三日廟見以次拜公姑伯叔嬸姆謂之拜茶是日外弟來名曰探房午讌新婦及外弟婦之父兄請而後至不輕造也四日外父母請壻及女名曰旋家外家親屬壻各備䞇儀惟外弟納之飲畢壻偕新婦同歸五日外家再請諸親相陪名曰會親女先往壻近午始至飲畢壻回女留三日後始回冠笄或於親迎日或在數日前詩禮之家女子既筓則居於房内不復外出常人則無論矣喪禮七日内成服五旬延僧道禮佛焚金楮名曰做功果還庫錢俗謂人初生欠隂庫錢死必還之既畢除靈孝子卒哭謝弔客家貧或於年餘擇日做功果除靈小祥致祭如禮大祥竟有先三四月擇吉致祭除服此則背禮之尤者若夫居喪朔望哭奠柩無久停則又風俗之美者矣生辰為紅麪食團彼此饋祝神佛誕日亦用以為獻娶婦之家親友製白麫餅或二十圓或十圓及簪珥肘酒為賀親友自内地來具酒食相招名曰洗醎水謂泛重洋而至亦猶北地洗塵之意正月元旦家製紅白米糕以祀神於四五鼓時拜賀親友上元節未字之女偷折人家花枝竹葉為人詬詈謂異日必得佳壻平民有毁傷他家墻垣或竊豕槽雞欄辱及父母亦謂一年大利街頭花燈簫鼓鎮夜喧闐至廿五六日方罷十六日各市㕓競饜酒肉名曰頭壓自是月以為常臘月既望踵而行之名曰尾壓四月八日僧衆沿門唱佛曲人贈以錢米五月五日清晨然稻梗一束向室内四隅熏之用楮錢送路旁名曰送蚊門楣間艾葉菖蒲兼挿禾稗一莖謂可避蚊蚋榕一枝謂老而彌健彼此以西瓜肉粽相饋遺祀神用諸紅色物自初五至初七好事者於海口淺處用錢或布為標杉板魚船爭相奪取勝者鳴鑼為得采土人亦號為鬬龍舟午時為小兒女結五色縷男繫左腕女繫右腕名曰神鋉三月盡四月朔望五月初一至初五日各寺廟及海岸各船鳴鑼擊鼓名曰龍船鼓謂主一年旺相七夕呼為巧節家供織女稱為七星孃紙糊綵亭晩備花粉香果酒醴三牲鴨蛋七枚飯七椀命道士祭獻畢則將端陽男女所結絲縷剪斷同花粉擲於屋上食螺螄以為明目黄豆煑熟洋糖拌裹及龍眼芋頭相贈貽名曰結縁七月十五日亦為盂蘭㑹數日前好事者醵金為首延僧衆作道塲將㑹中人生年月日時辰開明縁疏内陳設餅餌香櫞柚子蕉果黄棃鮮薑堆盤髙二三尺并設紙牌骰子煙筒等物至夜分同羮飯施燄口更有放水燈者頭家為紙燈千百晩於海邊親然之頭家幾人則各手放第一盞或捐中番錢一或減半置於燈内衆燈齊然沿海漁船爭相攫取得者謂一年大順沿街或三五十家為一局張燈結采陳設圖畫玩器鑼鼓喧雜觀者如堵二日事畢命優人演劇以為樂謂之壓醮尾月盡方罷中秋製月餅并筆墨紙研香囊瓶袋諸物羅列市㕓設置骰子賭勝奪采負則償值重陽前後競放紙鳶如内地春月是日儒生有殺犬取其首以祀魁星者餘肉則生徒聚啖歡飲竟日除夕前數日以各種生菜沸水泡甕中以供新歲祭祀之用餘則待發變後食之名曰隔年菜除夕殺黑鴨以祭神謂其壓除一歲凶事為紙虎口内實以鴨血或猪血生肉於門外燒之以禳除不祥衣服不衷袴露衣衫外者曰龍擺尾襪不繫帶脫落足面者曰鳳㸃頭農夫輿𨽻雲履綢衫服勞任役殊不雅觀也交易最尚番錢紅毛所鑄銀幣也長斜無式上印番字銀色低潮以内地兼金與之反多滯難用小制錢外多用昔年所鑄臺廣昌南紅銅錢并明時舊錢鵞眼荇葉散若流泉見行鼓鑄輪郭周好交易則棄而不用亦足異矣賣肉者吹角鎮日吹呼音甚凄楚冬來稻榖糖靛各邑輦致郡治車音脆薄如哀如訴時與吹角若相和然廣東志順德之容竒桂州黄連村吹角賣魚其北水古粉龍渚馬齊村則吹角賣肉相傳黄巢屯兵其地軍中為市以角聲號召不知此於何起也士夫健卒喜賭博永夜讙呶呼盧之外或壓銅錢射寶字以賭勝名曰壓寶又為紙牌三十六頁分文武院科四項文尊閣老武尊國公院尊學士科尊狀元每項九等納粟列庶吉士之上鴉片煙用麻葛同鴉土切絲於銅鐺内煑成鴉片拌煙另用竹筩實以㯶絲羣聚吸之索值數倍於常煙專治此者名開鴉片館吸一二次後便刻不能離暖氣直注丹田可竟夜不眠土人服此為導淫具肢體萎縮臟腑潰出不殺身不止官弁每為嚴禁常有身被逮繫猶求緩須臾再吸一筩者鴉片土出噶喇吧郡中鴃舌鳥語全不可曉如劉呼澇陳呼淡莊呼曾張呼丢余與吳侍御兩姓吳呼作襖黄則無音厄影切更為難省大武郡數處平地涌泉浸溢數里土人謂之坔水坔土音濫字典中無此字亦猶大浪泵之泵字典音聘土音蚌又所生少子名曰屘土音滿皆以己意譌撰祠廟邑志載陳湄川撫軍重修文廟碑記云董子曰仁人者正其誼不謀其利明其道不計其功建廟修學正誼明道之大端應無出此者予以為不計功而未嘗無功不謀利而未嘗無利臺令未有為臺道者而子得調臺道臺道未有擢為撫軍者而子得擢偏撫莫非先聖先賢黙為相之等語聖賢大道如日月經天江河行地正不藉崇飾廟貌皈依奉法使致感應報施建學明倫所以正人心厚風俗無一語及之竟説向福田利益豈可為訓府志至聖四御贊後即接施琅褒章臺鳳志學校或載入祀典或見之藝文俱為失次諸羅志學校别為一卷為是湄川建紫陽祠於學官之左旁列黄勉齋陳北溪蔡九峰真西山四先生木主春秋致祭兩廂列學舍令諸生肄業撥港官田二十八甲一分歲租一百六十八石六斗以為膏脯資水仙宫並祀禹王伍員屈原項羽兼列奡謂其能盪舟也一作魯般廟中亭脊雕鏤人物花草備極精巧皆潮州工匠為之關帝廟前殿祀帝像後殿祀帝父方巾綠袍土人云與祀文宣并及啟聖同義南路長治里前阿社祀五文昌梓潼關帝魁星朱衣吕祖後祀東王公西王母又偽鄭時建玉皇太子廟三年王船備物建醮志言之矣及問所祀何王相傳唐時三十六進士為張天師用法寃死上帝勅令五人巡遊天下三年一更即五瘟神飲饌器具悉為五分外懸池府大王燈一盞云偽鄭陳永華臨危前數日有人持柬借宅永華盛筵以待稱為池大人池呼陳為角宿大人揖讓酬對如大賔永華亡土人以為神故並祀焉求子者為郎君會祀張仙設酒饌果餌吹竹彈絲兩偶對立操土音以悦神商販東西洋通販諸國西洋則交趾占城暹羅下港加留吧東埔寨大泥舊港麻六甲啞齊彭亨柔佛丁機宜思吉港文郎馬神東洋則吕宋蘇禄貍里務沙瑶呐嗶嘽美洛居文萊雞籠淡水談薈明給事中何楷疏臺灣在彭湖島外水路距漳泉約兩日夜其地廣衍髙腴可比一大縣中國版圖所不載初窮民至其處不過規漁獵之利己耳其後見内地兵威不及往往聚而為盗近則紅夷築城其中與奸民私相互市屹然成大聚落矣春明夢餘録給事中傅元初疏海濵之民惟利是視走死地如騖往往至島外區脱之地曰臺灣者與紅毛畨為市紅毛業據之以為窟穴自臺灣兩日夜可至漳泉内港而吕宋佛郎機見我禁海亦時時私至雞籠淡水之地與奸民闌出者市貨其地一日可至臺灣官府即知之而不能禁禁之而不能絶徒使沿海將領奸民坐享洋利有禁洋之名未能盡禁洋之實此臣鄉之大可憂者蓋海外有大西洋有東洋大西洋則暹羅東埔諸國其國産蘇木胡椒犀角象牙諸貨東洋則吕宋其夷佛郎機也其國有銀山夷人鑄作銀錢獨盛中國人若往販大西洋則以其産物相抵若販吕宋則單得其銀錢諸夷皆好中國綾縀雜繒其土不蠶惟藉中國之絲到彼能織精好段疋服之以為華好是以湖綿百觔值銀百兩者至彼得價二倍而江西磁器福建糖品皆所嗜好百工技藝有挾一技以往者雖徒手無不得食民爭趣之永樂間先後招徠至紅毛番其夷名加留巴與佛郎機爭利不相得一心通市據在臺灣自明禁絶之而利乃盡歸於奸民矣同上近以開洋互市奉㫖紅夷挾市地方官果能飭備毖防禁絶勾引接濟狡謀自無繇逞乃海防名飭實弛奸商陽禁隂縱以致釀釁滋隙至開洋應否未見確議但云宜吕宋不宜臺灣均屬夷地商販給引出海何法綜稽能使畫地遵守着詳查開禁利害博諮熟審酌妥具奏據泉州鄉官史繼偕張瑞圖等稱開洋有四便漳州鄉官林宰等稱海冦起滅不係洋禁開閉臣㑹同鄒維璉勘得開洋之説心心有主喙喙爭鳴大約主開而不主禁總之言利不能無害衣食源開則利在民洋稅復而閩安諸稅可免則利在商得稅三四萬以壯軍實則利在凖備而亦有害即撫臣所謂四可慮者是已此就利害言也若體民情則開不容緩臣入閩關見髙山大川迴旋掩映自建徂興間關千里中求三里康莊而不可得巖下居民各就山根溪畔開墾力食率﨑嶇墝埆即方正五畝一段者亦未之見過泉眼界稍寛然已望洋海若矣其人則林林總總肩摩踵接望開洋不啻大旱望雨而臣反言開之不便達情之謂何故今日開洋全為民計非為夷計謂開洋而貧民不再從賊則可謂開洋而奸民盡化為良則不可謂開洋而奸民便於勾夷則可謂不開而全無海氛亦不可按閩摘畧明莊烈時工部尚書渭南南居益巡撫福建時紅毛以明月珠珊瑚樹異香火馬諸珍賄請互市公絶其使焚其貢物口占一絶云明月珊瑚貴莫言番書字字誑軍門牙前立下焚珠令不敢持將獻至尊授部將以方畧討之繫其酋髙文律閩人立石平逺臺以紀公績今嚴禁互市實苞桑之至計為國家計久遠者當看前明紅毛入犯中左肆行焚刼又復勾引劉香老首尾衝突海壖騷動雖竭力驅𠞰實苦不支慎勿狃目前之近利而輕言互市也海船多漳泉商賈貿易於漳州則載絲線漳紗剪絨紙料煙布草席甎瓦小杉料鼎鐺雨傘柑柚青果橘餅柿餅泉州則載磁器紙張興化則載杉板甎瓦福州則載大小杉料乾筍香菰建寧則載茶回時載米麥菽豆黑白糖餳番薯鹿肉售於厦門諸海口或載糖靛魚翅至上海小艇撥運姑蘇行市船回則載布疋紗縀枲棉凉煖㡌子牛油金腿包酒惠泉酒至浙江則載綾羅棉紬縐紗湖帕絨線寧波則載棉花草席至山東販賣粗細椀碟杉枋糖紙胡椒蘇木回日則載白蠟紫草藥材繭紬麥豆鹽肉紅棗核桃柿餅關東販賣烏茶黄茶紬縀布疋椀紙糖麯胡椒蘇木回日則載藥材𤓰子松子榛子海參銀魚蟶乾海壖彈丸商旅輻輳器物流通實有資於内地進貢康熙二十五年臺灣平設郡縣其王耀漢連氏甘勃氏遣陪臣賔先吧芝復奉表進貢表詞有云外邦之丸泥尺土乃是中國飛埃異域之勺水蹄涔原屬天家滴露云云貢物大珊瑚珠一串照身大鏡二面竒秀琥珀二十四塊哆囉絨二十五疋織金絨毯四領烏羽緞四疋緑倭緞一疋嗶嘰緞二十疋織金花緞五疋雜色細軟布文采細織布白毛裏布二百九十四疋大自鳴鐘一座琉璃燈一圓聚耀燭臺一懸琉璃盞異式五百八十一塊丁香三十擔氷片三十二觔甜肉豆䓻四甕鑲金小箱一隻内丁香油薔薇油檀香油桂花油各一礶葡萄酒二桶大象牙五隻鑲金鳥銃三十把馬銃六十把彩帶三十佩鑲金佩刀三十把鑲金雙利劔二十把單利劔六把照星月水鏡一執江河照水鏡二執雕製夾板二雙池北偶談荷蘭國最稱富饒乃遇風至臺假地於倭虎視盤踞大有深心迨何斌引鄭成功襲臺力戰不克而歸見我師掃盪鄭逆不覺讋服臺海使槎録卷二
