body:
  text: 臺海使槎録卷二常鎮揚通道黄叔璥撰武備洪武五年湯信國經畧海上以島民叛服難信議徙近郭二十一年盡徙嶼民廢巡司而墟其地繼而不逞者潛聚其中倭奴往來停泊取水亦必經此嘉隆以後海㓂曾一本等屢嘯聚為㓂萬厯二十年倭犯朝鮮哨者云將侵雞籠淡水於是議設兵戍險二十五年増設游兵四十五年倭犯龍門港増衝鋒游兵其地環衍可二百餘里地斥鹵水醎澁常燠多風稼穡差艱峙正中曰孃宫嶼從西嶼入二十里為茶盤又十里即孃宫嶼矣波平浪息無淜犇激射之勢其狀如湖因曰彭湖寛可泊船面為案山右為西安各置小城列銃為守名曰銃城又左為風櫃山高七八尺紅毛凹其中上壘土若雉堞今毁其城仍分軍戍守與案山西安相犄角東為蒔上澳豬母落水最當東南之衝由陸趨孃宫三十餘里舊有舟師戍守今更築銃城以防横突又東向為鎖管港林投仔龍門青螺諸澳龍門有原泉舊為居民聚落萬厯三十五年倭突犯泊此嶼西為西嶼頭有菓葉澳泉甚洌可飲稍北為竹篙灣又西為仔員又西北為丁字門水吼門今皆有兵戍守嶼北為北山墩有北太武稍卑為赤嵌循港而進為鎮海港壘城於此又西北為吉貝嶼又北太武與中墩稱兩太武俱最高便於瞭望孃宫稍後二里有穩澳山頗平坦自萬厯三十七年紅毛一舟䦨入彭湖久之乃去天啟二年高文律乘戍兵單弱以十餘船突擄彭島遂因山為城環海為池破浪長驅肆毒漳泉總兵俞咨臯移紅毛於北港乃復彭湖議於穩澳山開築城基大石壘砌高丈有七厚丈有八東西南留三門北設銃臺一座内蓋衙宇營房鑿井一口戍守於此以控制孃宫然議者謂彭湖為漳泉之門户而北港即彭湖之唇齒失北港則唇亡齒寒不特彭湖可慮即漳泉亦可憂也北港在彭湖東南亦謂之臺灣天啟以後盡為紅毛所踞方輿紀要彭湖遠在海外内澳可容千艘周遭平山為障止一隘口進不得方舟令賊得先據所謂一夫守險千人不能過者也矧山水多礁風信不常吾之戰艦難久泊矣而曰可以攻者否也往民居恃險為不軌乃徙而虛其地今不可以民實之明矣若分兵以守則兵分為弱逺輸為貧且絶島孤懸混茫萬頃脱輸不足而援後時是委軍以予敵也而曰可以守者否也亦嘗測其水勢沈舟則不盡其深輸石則難扞其急而曰可以塞者亦非也惟峻接濟之防而敷陳整旅以需其至則賊既失其所恃詎能為久頓謀哉圖書編南路自大崗山以下至下淡水瑯嶠社北路自木崗山以上至上淡水雞籠城其間如鳳山傀儡山諸羅山半線山皆扼野番之衝為陸汛所必防如下淡水硫磺溪大線頭鹿仔港皆當入海之道為水汛所必守至雞籠淡水乃臺灣極北之島突處海中毗連番社後壠一港與南日對峙即興化港口也後壠而上一百二十里為竹塹社對海壇鎮竹塹而上一百五十里為南嵌社對峙關㠉即福州閩安港口自南嵌至上淡水七十里對北膠淡水至雞籠三百里對沙埕烽火門皆浙江省界也大洋之外紅夷出入之路而又逺隔郡城港道四達往來一㠶直上偽鄭設重兵於彼雖曰逺禦紅夷實恐我師從福興分出以襲其後也雞籠至閩安不過七八更水若閩安興化等港聽商人往來貿易非止利源通裕萬一意外之警則厦門彭湖之師以應其前福泉興化之船以應其後首尾呼應緩急可恃東寧政事集臺灣環海依山欲内安必先守山欲外寧必重守水守山之法勞而易守海之法逸而難蓋陸地之防惟在嚴斥堠慎盤詰實心衛民勿以擾民不過得其人以任之而已水地之防必資於船多設船則有篷桅纜碇脩葺之工費歲需不貲是在主計者之持策也蓋臺灣善後之計莫急於増兵増兵自不得不増餉若僅駐鎮於郡駐協於安平南北兩路兵單汛薄恐未雨之憂不在鹿耳而在海港山社之間矣諸羅雜識臺灣水陸制兵盈萬費綦重矣乃彭湖安平之兵居其半水師汛重不容以覈減臺灣之兵居其半陸路汛廣又不得不議增然有可節省之道至便之術亦持籌者所必講也臺灣原有官莊即可為屯田其佃即可為屯兵不過加以訓練明其節制或倣古者耕七調三或立在要地屯守寓兵於農之中非特兵無跋涉歲免度支已也厯觀名臣奏議所用邊守之衆多取土著以土著宜於水土明於地勢而又欲自保其身家則守禦必周且聞名將用兵有取農人號為新力兵則以其性質椎魯手足强健雖風雨奔馳可無倦乏耳今議舊設制兵仍用内地更代増設之兵就臺另立屯田可以相資則兵力愈强而巡防彌周矣理臺末議陸師重馬力水師重舟力戰陣之時務爭上風而運轉不靈不能占居上風壓持不重或反退居下風此雖人力全在良舟然匠人為舟固守繩尺及駕中流而快利遲鈍之用乃見同時發棹而前後入港之日頓殊者何也蓋木之本質不類如鹽木為柁遇波濤乃不揺動餘則否輕重亦異木老則堅而重否則輕必得良材輕重配合如人一身筋骨相配然後善於運動也故水師必講於造舟者此其一也水師之灣泊猶陸師之安營凡水師不能於外洋覔戰皆於近港交鋒所以灣泊之處即是戰爭之場我舟先至利在居要以爭上風然風信難憑透發之後往往轉變先要泊穩倘一澳中有南風澳北風澳不同則寧泊南風澳以待此又老將之持重不可執一而論也故水師必明於灣泊者此其一也水師之入港猶陸師之克城凡港門為賊所守而險隘尤為賊所恃兵法有挾制其險而攻其虛之説以險處多虛故險可制而虛可攻耳故水師必詳於入港者此其一也此水師之大概也而其要在機曰扼要曰伺隙曰察變曰虛中四者夫扼要則握其權矣伺隙則分其力矣察變則奪其守矣虛中則避其害矣此所以能於袵席之上以過吾師尅期取敵㨗如也要而言之師之用在舟舟之用在水水之用在風舟與師相習風與水相遭其用在於變而通之以盡利神而明之存乎人易曰刳木為舟剡木為楫舟楫之利以濟不通蓋取諸渙渙者風水之義聖人一言盡之矣同上彭湖出洋廵哨由祖媽宫澳開駕向西至西嶼頭經内塹外塹復收泊西嶼頭内大菓葉登岸大菓葉二里左為緝馬灣右為小菓葉南四里至内塹按季輪撥千把各一員澳口礮臺一東山頂烽臺三内塹西南三里至外塹澳口礮臺一西山頂烽臺三再北經緝馬灣小菓葉八里至小池角西北四里至大池角十五里至小門礮臺一烽臺一四里至鴿界頭横礁三里至竹篙灣仍回至大菓葉十里登舟由内港駕至北山瓦硐港寄泊登岸四里至通梁三里至後寮二里至大北山山頂瞭望北為吉貝嶼姑婆嶼土地公嶼鐵砧嶼目嶼白沙仔嶼險礁東為灣貝嶼藍笨仔嶼鳥嶼雞膳嶼碇齒嶼欲赴吉貝各嶼須出吼門往北若逆流逆風未可駕駛瓦硐港四里至大赤嵌社南有塘汛按季輪撥千把各一員一里至小赤嵌三里至港仔東二里即﨑頭東南一里至鎮海三里至港尾二里至城前仍至瓦硐港登舟從吼門出洋哨巡由西嶼頭外收入内垵寄泊回媽祖宫澳再媽祖宫澳開船出哨由西往南經雞籠嶼四角仔桶盤嶼虎井直抵八罩金雞澳入挽門汛南北風可泊五六船按季輪撥千把各一員汛後山頂礮臺一由塘口往西南一里至網垵南為半砰嶼頭巾礁鐵砧嶼碀仔嶼西南為大嶼西北為花嶼貓嶼草嶼西北半里至甕菜堀北四里至花宅四里至水垵垵口北礮臺一南風時可泊船復回挽門汛東隔半里為將軍澳與挽門汛對峙立冬後可泊四五船東臨海有石山名船帆嶼山頂礮臺一向北為金雞嶼南北風俱可泊船在將軍澳後北有馬鞍嶼由挽門登舟出金雞嶼口往東南至東吉西吉鋤頭精嶼至文良港駕回經過鎖管港豬母落水虎井嵵裏風櫃尾雞籠嶼四角仔回媽祖宫澳陸巡由媽祖宫澳四里至暗澳有巡檢司三里至東衞五里至大城北三里至隘門仔一里至林頭仔垵南香爐嶼鼓架礁四里至尖山仔一里至文良港東鼻頭烽臺一可望陽嶼隂嶼北五里至菓葉仔二里至奎壁港北三里即奎壁港山西三里白灣坑二里至湖東二里至湖西五里至紅羅罩北三里至青螺仔紅羅罩半里至西溪仔南三里至太武仔西三里至港底北一里至東石六里至沙港頭南三里至鼎灣西北三里至中墩嶼潮退可通西南二里至潭邊南二里至港仔尾三里至蚱脚嶼二里至東衛四里至西衛三里至後堀潭四里至媽祖宫澳再陸巡用大杉板往嵵裏後山登岸嵵裏澳口礮臺一山頂烽臺一五里至風櫃尾澳口礮臺一烽臺一東二里至井仔垵東南四里豬母落水東北二里鎖管港西北一里雞母塢北五里至鐵線尾八里至烏嵌五里至雙頭掛與大城北相對三里至菜園三里至暗澳回媽祖宫澳副將薄有成出哨月報康熙辛丑兵部奏准彭湖係臺灣咽喉𦂳要適中之地移臺灣總兵駐彭湖臺灣陸路改設副將金門總兵黄英奏言彭湖為臺灣之門户今將臺灣總兵移改彭湖臺灣設立副將與水師彼此接應遥度形勢盡善之謀無大於此臣閲地勢輕重彭湖雖稱三十六島居於臺厦之中究皆一抔之土錯落彈丸除媽宫八罩畧有人烟餘悉冷落荒嶼原設副將儘堪防守兹臺灣南北延袤二千餘里村莊番社閭井户口不下百餘萬叢山深林最易藏奸非總兵不足以資彈壓况安平水師及南北路副㕘各員與臺灣副將職位不相上下有事勢必各懐已見非若總兵可行調度今若將總兵設在彭湖與臺灣懸隔往來船隻俱候風時臺灣水陸各營倘有緊急事機不能朝發夕至是彭湖固臺灣之門尸而臺灣實彭湖之腹心形勢重於彭湖關係沿海各省要害請將總兵仍設臺灣庶得居重馭輕之道以造海宇無疆之福提督姚堂亦為陳請仍照舊制駐劄安平水師額設戰船中營平字號十八號内趕繒十雙篷艍六雙篷䑩二左營定字號十六號内趕繒八雙篷艍八右營澄字號十八號内趕繒十雙篷艍八彭湖水師額設戰船左營綏字號十八號右營寧字號十八號與安平中右營同趕繒長四五丈至七八丈雙篷艍長二丈至五丈設為分總巡哨之法每年二三四五月為一巡期六七八月為一巡期輪撥本營將備一員帶領兵船四分巡所轄洋面副將統領兵船四總巡各營所轄洋面大趕繒配兵六十小趕繒五十大艍四十小艍三十四巡期滿日官兵船隻撤回安平水次十月至正月各船配兵一半於本轄水汛巡哨淡水營舊撥左營趕繒二近又撥道標波字號趕繒四又道標雙篷艍四亦歸鎮標各船三年小修六年大修九年再大修十二年拆造小修自三十兩至一百五六十兩大修自四十兩至二百三十餘兩拆造自五十兩至三百六十兩不等鳳山打狗港距鹿耳門水程三更北風盛發鹿耳門港道狹隘舟不得進而打狗可揚帆直入由此登岸者甚多水師把總配哨船二隻領兵防汛下淡水離邑既遠奸宄易滋陸路千總領兵防汛此二處為南路水陸扼要之地偽鄭在臺民人往來至半線而止自歸版圖後淡水等處亦從無人踪故北路營汛止大肚安設百總一名領兵防守沙轆牛罵二社則為境外自海盗鄭盡心脱逃部文行知夥盗供稱鄭盡心約在江浙交界之盡山花鳥台州之魚山福建臺灣之淡水等處藏匿維時總兵崔相國分撥千總一員領兵分防淡水自後遂以為常而業戸開墾往來漸衆鎮標原額兵三千三百五十名道標兵三百六十名康熙六十一年提督姚堂奏准將道標裁歸鎮標安平協二千五百名彭湖協二千名南路營八百九十名北路營八百九十名淡水營五百名全郡共兵九千四百九十名合撥閩省將軍兵五百名共一萬六十年總督滿保疏請於府治増一千名四面協䕶南路增一千名以五百駐崗山前䕶本營後䕶府東並保䕶